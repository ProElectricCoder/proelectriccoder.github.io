<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electrolyte – Open Graph image (1200×630)</title>
<!-- Source of ../Preview.png. Regenerate it with:  node make-og.js   (see make-og.js) -->
<style>
@font-face { font-family: 'Electrolyte'; src: url('../Electrolyte.otf') format('opentype'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #000011; }
body {
	position: relative;
	font-family: 'Electrolyte', monospace;
	color: #e8edf8;
	background:
		radial-gradient(700px 420px at 50% 42%, rgba(0,255,255,0.16) 0%, transparent 70%),
		radial-gradient(900px 500px at 50% -10%, #002a5c 0%, transparent 65%),
		#000011;
}
/* faint monospace grid, to show that every character is the same width */
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%); -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%); }
.frame { position: absolute; inset: 28px; border: 2px solid rgba(0,255,255,0.28); border-radius: 26px; }
.top { position: absolute; top: 62px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 26px; color: rgba(232,237,248,0.7); letter-spacing: 0.04em; }
.top b { font-weight: normal; color: #00ffff; }
h1 { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: normal; font-size: 168px; line-height: 1; color: #00ffff; letter-spacing: 0.01em; text-shadow: 0 0 36px rgba(0,255,255,0.55), 0 0 90px rgba(0,255,255,0.3); }
.tag { position: absolute; left: 0; right: 0; top: 345px; text-align: center; font-size: 36px; color: rgba(232,237,248,0.88); letter-spacing: 0.03em; }
.row { position: absolute; left: 80px; right: 80px; bottom: 74px; display: flex; justify-content: space-between; align-items: flex-end; }
.chars { font-size: 34px; line-height: 1.4; color: rgba(232,237,248,0.85); letter-spacing: 0.06em; }
.chars span { color: #00ffff; }
.clock { padding: 14px 26px; border-radius: 16px; border: 2px solid rgba(0,255,255,0.4); background: rgba(0,255,255,0.07); font-size: 66px; line-height: 1; color: #00ffff; letter-spacing: 0.04em; text-shadow: 0 0 22px rgba(0,255,255,0.45); }
</style>
</head>
<body>
	<div class="grid"></div>
	<div class="frame"></div>
	<div class="top"><span><b>ProElectricCoder</b> / Fonts</span><span>OpenType · monospace</span></div>
	<h1>Electrolyte</h1>
	<div class="tag">A monospace font for clocks, code and anything that lines up</div>
	<div class="row">
		<div class="chars">ABCDEFGHIJKLM<br><span>0123456789</span> :;!?@#$%&amp;</div>
		<div class="clock">12:34:56</div>
	</div>
</body>
</html>
