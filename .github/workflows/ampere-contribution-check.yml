name: Ampere contribution check

# Runs on every pull request so it can be a required check. It only reads the pull request and never has access to secrets.
# The add-on and news rules only apply when a pull request touches add-ons or news; other pull requests pass straight away.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check add-ons, news and the safety checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-ampere.js
