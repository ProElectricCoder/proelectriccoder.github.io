<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stickman Launcher: Fort Destruction</title>

<!--
  CrazyGames SDK v3 -- live.
  ------------------------------------------------------------------
  The CrazySDK wrapper in the <script> below (search "CrazySDK") checks
  for window.CrazyGames before touching it, so this build still runs
  fine anywhere the SDK isn't present (local testing, other hosts) --
  it just skips ads/saves/etc. and plays standalone.
  Docs: https://docs.crazygames.com/sdk/html5-v3/ (verified Sept 2026).
-->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

<style>
  :root {
    --ink: #16213E;
    --ink-deep: #0D1526;
    --gold: #FFC94C;
    --teal: #43D9C8;
    --violet: #B79CF2;
    --ember: #FF8A3D;
    --paper: #E9ECF5;
    --font-ui: ui-rounded, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; overflow: hidden;
    height: 100%;
    background: #6EC6E8;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    font-family: var(--font-ui);
  }

  button { font-family: inherit; border: none; cursor: pointer; background: none; padding: 0; color: inherit; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  canvas { display: block; touch-action: none; }

  #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  #ui-layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px;
    pointer-events: none;
  }

  /* Loading */
  #loading-screen {
    position: absolute; inset: 0; z-index: 20;
    background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--paper);
    font-size: 0.95rem;
    transition: opacity 0.35s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; margin-bottom: 14px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Title screen -- visible only before the player's first launch */
  #title-screen {
    position: absolute; top: 12%; left: 50%;
    transform: translateX(-50%);
    width: 100%; padding: 0 16px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  body.pre-launch #title-screen { opacity: 1; }
  .title-main {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", "Marker Felt", cursive;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 700;
    color: #000;
    text-shadow: 0 4px 0 var(--gold), 0 10px 18px rgba(0, 0, 0, 0.35);
  }
  .title-stickman {
    width: 0.6em;
    height: 0.88em;
    vertical-align: -0.14em;
    margin: 0 0.02em;
    overflow: visible;
  }
  .title-sub {
    font-family: var(--font-mono);
    font-size: clamp(0.7rem, 2.2vw, 0.95rem);
    font-weight: 700;
    color: var(--paper);
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-shadow: 0 2px 0 var(--ink-deep);
  }

  /* Before the first launch, show nothing but the title + aim-hint --
     hud-panel, the mute button, the minimap, and the fuel tank fade in once
     you launch. */
  .hud-panel, #mute-btn, .minimap-wrap, .fuel-tank { transition: opacity 0.35s ease; }
  body.pre-launch .hud-panel,
  body.pre-launch #mute-btn,
  body.pre-launch .minimap-wrap,
  body.pre-launch .fuel-tank {
    opacity: 0;
    pointer-events: none;
  }

  /* Thin jetpack-fuel gauge, pinned to the left edge. */
  .fuel-tank {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 150px;
    background: var(--ink-deep);
    border-radius: 8px;
    border: 2px solid var(--ink);
    overflow: hidden;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: flex-end;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  }
  .fuel-tank-fill {
    width: 100%; height: 0%;
    background: linear-gradient(to top, #ea580c, #fb923c 60%, #fde68a);
    transition: height 0.12s linear;
  }
  .fuel-tank-cap {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 10px; height: 8px;
    background: var(--ink);
    border-radius: 3px 3px 0 0;
    border: 2px solid var(--ink-deep);
    border-bottom: none;
  }
  @media (max-width: 480px) {
    .fuel-tank { height: 110px; width: 13px; left: 8px; }
  }

  /* Top cluster: minimap + HUD row, grouped so both stay pinned to the
     top edge while #ui-layer space-betweens against the bottom cluster */
  .top-cluster { display: flex; flex-direction: column; gap: 10px; width: 100%; }

  .minimap-wrap {
    align-self: center;
    width: min(92vw, 560px);
    height: 56px;
    background: var(--ink);
    border-radius: 10px;
    border-bottom: 3px solid var(--ink-deep);
    padding: 4px;
    overflow: hidden;
  }
  #minimapCanvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  .hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .hud-panel {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: 10px;
    border-bottom: 3px solid var(--ink-deep);
  }
  .hud-cash { font-family: var(--font-mono); font-size: 1.45rem; font-weight: 700; color: var(--gold); }
  .hud-stat { font-family: var(--font-mono); font-size: 0.95rem; color: var(--paper); margin-top: 2px; }
  #hud-dist { color: var(--teal); font-weight: 600; }
  #hud-height { color: var(--violet); font-weight: 600; }
  #hud-fuel { color: #fb923c; font-weight: 600; }

  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .icon-btn {
    pointer-events: auto;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 3px solid var(--ink-deep);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: translateY(2px); border-bottom-width: 1px; }

  #power-btn {
    pointer-events: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--violet);
    color: var(--ink-deep);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(183, 156, 242, 0.45);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  #power-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #power-btn:active { transform: translateY(2px); }

  .aim-hint {
    background: var(--teal);
    color: var(--ink-deep);
    padding: 9px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .aim-hint.hidden { display: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* Bottom cluster: toasts, reward button, shop */
  .bottom-cluster { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

  .toast {
    text-align: center;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  #last-run-toast {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    padding: 6px 18px;
  }

  #landing-cash-toast {
    background: var(--gold);
    color: var(--ink-deep);
    padding: 10px 26px;
    border-radius: 20px;
    box-shadow: 0 10px 24px rgba(255, 201, 76, 0.4);
  }
  .cash-amount { display: block; font-family: var(--font-mono); font-size: 1.6rem; font-weight: 800; }
  .cash-label { font-size: 0.68rem; font-weight: 600; opacity: 0.75; }

  #reward-btn {
    pointer-events: none;
    background: var(--ember);
    color: #331700;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(255, 138, 61, 0.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #reward-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #reward-btn:active { transform: translateY(2px); }

  #power-ad-btn {
    pointer-events: none;
    background: var(--teal);
    color: var(--ink-deep);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 9px 16px;
    border-radius: 10px;
    box-shadow: 0 8px 16px rgba(67, 217, 200, 0.35);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #power-ad-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #power-ad-btn:active { transform: translateY(2px); }

  /* SHOW_AD_UI (in the script below) toggles this class at boot -- hides
     every ad-related button outright, regardless of what .show is doing. */
  body.hide-ad-ui #reward-btn,
  body.hide-ad-ui #power-ad-btn {
    display: none !important;
  }

  /* Shop */
  #shop-bar {
    display: flex; justify-content: center; gap: 8px;
    width: 100%; max-width: 720px;
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #shop-bar.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .shop-btn {
    flex: 1; min-width: 0;
    padding: 9px;
    border-radius: 12px;
    border-bottom: 3px solid var(--ink-deep);
    background: var(--ink);
    color: #7C879E;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: left;
    cursor: not-allowed;
  }
  .shop-btn.affordable { color: var(--paper); cursor: pointer; }
  .shop-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
  .shop-name { font-weight: 700; font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shop-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.65rem; margin-top: 3px; }
  .shop-meta .lvl-val { color: var(--gold); font-weight: 700; }
  .shop-price {
    margin-top: 7px; text-align: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 0.78rem;
    padding: 4px 0; border-radius: 7px;
    background: var(--ink-deep); color: #5A6478;
  }
  .shop-btn.affordable .shop-price { background: var(--gold); color: var(--ink-deep); }
  .shop-btn.maxed .shop-price { color: var(--paper); }

  @media (max-width: 480px) {
    .minimap-wrap { height: 42px; }
    .hud-cash { font-size: 1.2rem; }
    .hud-stat { font-size: 0.82rem; }
    .hud-panel { padding: 8px 14px; }
    #shop-bar { flex-wrap: wrap; }
    .shop-btn { min-width: calc(50% - 4px); flex: 0 0 calc(50% - 4px); }
  }

  /* Achievements / Characters overlays */
  .overlay-panel {
    position: absolute; inset: 0; z-index: 25;
    background: rgba(13, 21, 38, 0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .overlay-panel.show { opacity: 1; pointer-events: auto; }
  .overlay-card {
    width: min(92vw, 440px);
    max-height: 82vh;
    overflow-y: auto;
    background: var(--ink);
    border-radius: 16px;
    border-bottom: 4px solid var(--ink-deep);
    padding: 16px;
    color: var(--paper);
    position: relative;
  }
  .overlay-header {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; font-size: 1.05rem;
    /* Sticky + the negative-margin/compensating-padding trick below keeps
       this pinned to the top of the card's own scroll area (see
       .overlay-card's overflow-y:auto) -- otherwise, once the list below
       is tall enough to scroll, the header (and its close button) scrolls
       away with it, and tapping where the X used to be hits nothing. */
    position: sticky; top: -16px; z-index: 2;
    margin: -16px -16px 10px;
    padding: 16px 16px 10px;
    background: var(--ink);
    border-radius: 16px 16px 0 0;
  }
  .overlay-close {
    pointer-events: auto;
    position: relative; z-index: 1;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--ink-deep); color: var(--paper);
    font-size: 1.3rem; line-height: 1;
  }
  .overlay-section-title {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
    color: var(--teal); text-transform: uppercase;
    margin: 14px 0 6px;
  }
  .overlay-list { display: flex; flex-direction: column; gap: 8px; }
  .overlay-item { background: var(--ink-deep); border-radius: 10px; padding: 9px 12px; }
  .overlay-item.done { outline: 2px solid var(--gold); }
  .overlay-item.selected { outline: 2px solid var(--teal); }
  .overlay-item-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; font-weight: 700; gap: 8px;
  }
  .overlay-item-label { display: inline-flex; align-items: center; gap: 6px; }
  .overlay-item-desc { font-size: 0.72rem; color: #9aa5bd; margin-top: 3px; }
  .overlay-action {
    pointer-events: auto;
    font-family: var(--font-mono); font-weight: 700; font-size: 0.68rem;
    padding: 5px 10px; border-radius: 7px;
    background: var(--gold); color: var(--ink-deep);
    white-space: nowrap;
  }
  .overlay-action.disabled { background: #3a4256; color: #6b7690; }
  .progress-track {
    margin-top: 6px; height: 6px; border-radius: 4px;
    background: rgba(255, 255, 255, 0.12); overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--teal); border-radius: 4px; }

  /* Unlock / achievement toast -- top-center, independent of the bottom toasts */
  #unlock-toast {
    position: absolute; top: 14%; left: 50%; transform: translate(-50%, -10px);
    z-index: 18;
    background: var(--gold); color: var(--ink-deep);
    padding: 10px 22px; border-radius: 14px;
    text-align: center;
    box-shadow: 0 10px 24px rgba(255, 201, 76, 0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #unlock-toast.show { opacity: 1; transform: translate(-50%, 0); }
  #unlock-toast-title { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; opacity: 0.75; }
  #unlock-toast-text { font-weight: 800; font-size: 1rem; }

  /* Recording */
  #record-btn.armed { background: #dc2626; }
  #recording-download {
    pointer-events: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--violet);
    color: var(--ink-deep);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 9px 16px;
    border-radius: 10px;
    text-decoration: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #recording-download.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div>Prepping the launch pad&hellip;</div>
  </div>

  <div id="title-screen">
    <div class="title-main" aria-label="Stickman Launcher">ST<svg class="title-stickman" viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="12" y1="11" x2="12" y2="22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="14" x2="4" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="14" x2="20" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="22" x2="5" y2="30" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="22" x2="19" y2="30" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>CKMAN LAUNCHER</div>
    <div class="title-sub">FORT DESTRUCTION</div>
  </div>

  <div id="ui-layer">
    <div class="top-cluster">
      <div class="minimap-wrap">
        <canvas id="minimapCanvas"></canvas>
      </div>
      <div class="hud-row">
        <div class="hud-panel">
          <div class="hud-cash">Cash: $<span id="hud-cash">0</span></div>
          <div class="hud-stat">Distance: <span id="hud-dist">0</span>m</div>
          <div class="hud-stat">Height: <span id="hud-height">0</span>m</div>
          <div class="hud-stat">Fuel: <span id="hud-fuel">0</span>%</div>
        </div>
        <div class="top-right">
          <button id="mute-btn" class="icon-btn" aria-label="Mute">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
          <button id="achievements-btn" class="icon-btn" aria-label="Achievements and daily challenges">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M12 13v3"/><path d="M9 20h6"/><path d="M10 16h4l1 4H9l1-4z"/></svg>
          </button>
          <button id="characters-btn" class="icon-btn" aria-label="Shop: stickman types and costumes">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          </button>
          <button id="record-btn" class="icon-btn" aria-label="Arm run recording">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#dc2626" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <button id="power-btn">Power</button>
          <div id="aim-hint" class="aim-hint hidden">Drag back, then release to launch.</div>
        </div>
      </div>
    </div>

    <div class="bottom-cluster">
      <div id="last-run-toast" class="toast"><span id="last-run-text">Last run: 0m</span></div>
      <div id="landing-cash-toast" class="toast">
        <span class="cash-amount">+$<span id="landing-cash-val">0</span></span>
        <span class="cash-label">cash earned</span>
      </div>
      <button id="reward-btn">Watch ad for 2&times; cash</button>
      <button id="power-ad-btn">Watch ad: get a power</button>
      <a id="recording-download" class="toast" download="stickman-run.webm">Download last run
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v14"/><path d="M6 13l6 6 6-6"/></svg>
      </a>
      <div id="shop-bar"></div>
    </div>
  </div>

  <div id="fuel-tank" class="fuel-tank" aria-hidden="true">
    <div id="fuel-tank-fill" class="fuel-tank-fill"></div>
    <div class="fuel-tank-cap"></div>
  </div>

  <div id="unlock-toast" class="toast">
    <div id="unlock-toast-title">Achievement Unlocked</div>
    <div id="unlock-toast-text"></div>
  </div>

  <div id="achievements-overlay" class="overlay-panel">
    <div class="overlay-card">
      <div class="overlay-header"><span>Achievements &amp; Dailies</span><button class="overlay-close" data-close="achievements-overlay">&times;</button></div>
      <div class="overlay-section-title">Today's Challenges</div>
      <div id="daily-list" class="overlay-list"></div>
      <div class="overlay-section-title">Achievements</div>
      <div id="achv-list" class="overlay-list"></div>
    </div>
  </div>

  <div id="characters-overlay" class="overlay-panel">
    <div class="overlay-card">
      <div class="overlay-header"><span>Stickman &amp; Costume</span><button class="overlay-close" data-close="characters-overlay">&times;</button></div>
      <div class="overlay-section-title">Stickman Type</div>
      <div id="type-list" class="overlay-list"></div>
      <div class="overlay-section-title">Costume</div>
      <div id="costume-list" class="overlay-list"></div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================================
// CrazyGames SDK v3 -- commented integration
// ----------------------------------------------------------------------------
// Every method below checks `this.ready` (or `window.CrazyGames` directly in
// init) before touching the SDK, so this same file still runs standalone
// anywhere the SDK script doesn't load -- local testing, other hosts, etc.
// Verified against https://docs.crazygames.com/sdk/html5-v3/ (Sept 2026).
// ============================================================================
const CrazySDK = {
    ready: false,

    init() {
        if (typeof window.CrazyGames === 'undefined') {
            console.warn('[CrazySDK] SDK script not present -- running standalone.');
            return;
        }
        window.CrazyGames.SDK.init().then(() => {
            this.ready = true;
            console.log('[CrazySDK] ready, environment:', window.CrazyGames.SDK.environment);
            this.loadingStart();
            loadGame();
            applyCharacterStats();
            updateShopUI();
            updateHUD();
            ensureDaily();
            renderAchievementsPanel();
            renderCharactersPanel();
            this.loadingStop();
            this.gameplayStart();
        }).catch((e) => console.warn('[CrazySDK] init failed', e));
    },

    loadingStart() {
        if (this.ready) window.CrazyGames.SDK.game.loadingStart();
    },

    loadingStop() {
        if (this.ready) window.CrazyGames.SDK.game.loadingStop();
    },

    // Call whenever the player is actively playing / resumes after a break.
    gameplayStart() {
        if (this.ready) window.CrazyGames.SDK.game.gameplayStart();
    },

    // Call on every break: menu, pause, or right before an ad.
    gameplayStop() {
        if (this.ready) window.CrazyGames.SDK.game.gameplayStop();
    },

    // Use sparingly -- reserved for genuinely special moments (new best run).
    happytime() {
        if (this.ready) window.CrazyGames.SDK.game.happytime();
    },

    // CrazyGames auto-throttles midgame ads (max ~1 every 3 min), so it's
    // fine to just call this after every landing with no extra bookkeeping.
    requestMidgameAd() {
        if (!this.ready) return;
        window.CrazyGames.SDK.ad.requestAd('midgame', {
            adStarted: () => {
                gamePaused = true; adMuted = true;
                if (audioCtx) audioCtx.suspend();
                CrazySDK.gameplayStop();
            },
            adFinished: () => {
                gamePaused = false; adMuted = false;
                if (audioCtx) audioCtx.resume();
                CrazySDK.gameplayStart();
            },
            adError: (error) => {
                console.log('[CrazySDK] midgame ad error', error);
                gamePaused = false; adMuted = false;
                if (audioCtx) audioCtx.resume();
                CrazySDK.gameplayStart();
            },
        });
    },

    // CrazyGames requires rewarded-ad buttons to always have a real effect;
    // if the SDK isn't connected we just grant the reward directly so the
    // button still does something (and stays testable locally).
    requestRewardedAd(onReward) {
        if (this.ready) {
            window.CrazyGames.SDK.ad.requestAd('rewarded', {
                adStarted: () => {
                    gamePaused = true; adMuted = true;
                    if (audioCtx) audioCtx.suspend();
                    CrazySDK.gameplayStop();
                },
                adFinished: () => {
                    gamePaused = false; adMuted = false;
                    if (audioCtx) audioCtx.resume();
                    CrazySDK.gameplayStart();
                    onReward();
                },
                adError: (error) => {
                    console.log('[CrazySDK] rewarded ad error', error);
                    gamePaused = false; adMuted = false;
                    if (audioCtx) audioCtx.resume();
                    CrazySDK.gameplayStart();
                },
            });
            return;
        }
        onReward();
    },

    // CrazyGames' data module survives third-party storage restrictions
    // inside their iframe and syncs across a signed-in player's devices --
    // used by saveGame()/loadGame() below for cash, best run, and upgrades.
    saveProgress(data) {
        if (this.ready) window.CrazyGames.SDK.data.setItem('save', JSON.stringify(data));
    },

    loadProgress() {
        if (this.ready) {
            const raw = window.CrazyGames.SDK.data.getItem('save');
            return raw ? JSON.parse(raw) : null;
        }
        return null;
    },
};

// ============================================================================
// Audio -- small synthesized effects via Web Audio API (no external files)
// ============================================================================
let audioCtx = null;
let muted = false;
let adMuted = false;
let audioDestNode = null; // MediaStreamDestination, only needed when recording a run

function ensureAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestNode = audioCtx.createMediaStreamDestination();
        } catch (e) {
            audioCtx = null;
        }
    } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// Every synthesized sound routes here instead of connecting to
// audioCtx.destination directly, so a run recording (see "Recording" below)
// can pick up game audio via audioDestNode without a second audio graph.
function routeOut(node) {
    node.connect(audioCtx.destination);
    if (audioDestNode) node.connect(audioDestNode);
}

function beep({ freq = 440, freqEnd = null, duration = 0.12, type = 'sine', gain = 0.15 } = {}) {
    if (muted || adMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + duration);
    g.gain.setValueAtTime(gain, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(g);
    routeOut(g);
    osc.start(now);
    osc.stop(now + duration);
}

function playLaunch() { beep({ freq: 180, freqEnd: 700, duration: 0.18, type: 'sawtooth', gain: 0.12 }); }
function playBounce() { beep({ freq: 220, freqEnd: 80, duration: 0.09, type: 'square', gain: 0.10 }); }
function playLand() {
    beep({ freq: 523.25, duration: 0.10, type: 'sine', gain: 0.14 });
    setTimeout(() => beep({ freq: 783.99, duration: 0.16, type: 'sine', gain: 0.14 }), 90);
}

let jetpackOsc = null, jetpackGain = null;
function startJetpackSound() {
    if (jetpackOsc || !audioCtx || muted || adMuted) return;
    jetpackOsc = audioCtx.createOscillator();
    jetpackGain = audioCtx.createGain();
    jetpackOsc.type = 'sawtooth';
    jetpackOsc.frequency.value = 90;
    jetpackGain.gain.value = 0.05;
    jetpackOsc.connect(jetpackGain);
    routeOut(jetpackGain);
    jetpackOsc.start();
}
function stopJetpackSound() {
    if (!jetpackOsc) return;
    try { jetpackOsc.stop(); } catch (e) { /* already stopped */ }
    jetpackOsc.disconnect();
    jetpackGain.disconnect();
    jetpackOsc = null;
    jetpackGain = null;
}

// ============================================================================
// Particles (landing dust) + screen shake
// ============================================================================
let particles = [];
let shake = 0;

function spawnDust(x, y, count = 14, color = '#a8a29e') {
    for (let i = 0; i < count; i++) {
        let angle = Math.PI + Math.random() * Math.PI;
        let speed = 2 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            size: 3 + Math.random() * 4,
            color,
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += 0.15;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function triggerShake(amount) {
    shake = Math.max(shake, amount);
}

let floaters = [];

function spawnFloater(x, y, text, color) {
    floaters.push({ x, y, vy: -1.2, life: 1, text, color });
}

function updateFloaters() {
    for (let i = floaters.length - 1; i >= 0; i--) {
        let f = floaters[i];
        f.y += f.vy;
        f.life -= 0.02;
        if (f.life <= 0) floaters.splice(i, 1);
    }
}

function drawFloaters() {
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    floaters.forEach((f) => {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
}

// ============================================================================
// Character animation -- rigid, fixed-length limbs that swing at the joint
// (like a jointed paper doll) instead of stretching. "angle" is a spring-
// damped deflection added on top of each part's rest angle; length never
// changes, so nothing ever looks stretchy -- only movable.
// ============================================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

let limbs = {
    torso: { angle: 0, angVel: 0, restAngle: -Math.PI / 2, length: 16 },
    lh: { angle: 0, angVel: 0, restAngle: Math.atan2(5, -10), length: Math.hypot(10, 5) },
    rh: { angle: 0, angVel: 0, restAngle: Math.atan2(5, 10), length: Math.hypot(10, 5) },
    lf: { angle: 0, angVel: 0, restAngle: Math.atan2(13, -8), length: Math.hypot(8, 13) },
    rf: { angle: 0, angVel: 0, restAngle: Math.atan2(13, 8), length: Math.hypot(8, 13) },
};
let prevRotation = 0;

function updateAngleSpring(part, target) {
    let accel = (target - part.angle) * 0.22 - part.angVel * 0.38;
    part.angVel += accel;
    part.angle += part.angVel;
}

function updateLimbs() {
    let angVel = player.rotation - prevRotation;
    prevRotation = player.rotation;

    // Velocity in the body's own (rotated) frame, so limbs swing relative
    // to the direction of travel no matter how the body has spun.
    let cosR = Math.cos(-player.rotation), sinR = Math.sin(-player.rotation);
    let localVx = player.vx * cosR - player.vy * sinR;
    let localVy = player.vx * sinR + player.vy * cosR;

    let sweep = clamp(-localVx * 0.025, -0.5, 0.5);
    let bob = clamp(-localVy * 0.015, -0.25, 0.25);
    let spin = clamp(angVel * 1.6, -0.6, 0.6);

    updateAngleSpring(limbs.torso, clamp(sweep * 0.5 + spin * 0.4, -0.45, 0.45));
    updateAngleSpring(limbs.lh, sweep + bob - spin);
    updateAngleSpring(limbs.rh, sweep + bob + spin);
    updateAngleSpring(limbs.lf, (sweep + bob) * 0.55 - spin * 0.5);
    updateAngleSpring(limbs.rf, (sweep + bob) * 0.55 + spin * 0.5);
}

// ============================================================================
// Terrain
// ============================================================================
function naturalGroundY(x) {
    let base = player.groundY;
    if (x <= player.startX + 800) return base;
    let dx = x - (player.startX + 800);
    let h1 = Math.sin(dx * 0.0012) * 200;
    let h2 = Math.sin(dx * 0.0035) * 120;
    let h3 = Math.sin(dx * 0.008) * 50;
    return base - (h1 + h2 + h3);
}

// Flat pads carved into the terrain so buildings always sit level instead of
// on a slope. Registered by generateForts() before anything else queries
// getGroundY for those X ranges.
let flatZones = [];

function getGroundY(x) {
    for (let i = 0; i < flatZones.length; i++) {
        let z = flatZones[i];
        let d = Math.abs(x - z.x);
        if (d <= z.halfWidth) return z.height;
        if (d <= z.halfWidth + z.blend) {
            let t = (d - z.halfWidth) / z.blend;
            return z.height * (1 - t) + naturalGroundY(x) * t;
        }
    }
    return naturalGroundY(x);
}

// ============================================================================
// Forts -- fixed-preset buildings (25-50 blocks) on flat pads, sometimes
// guarded by a sentry on top. Generated once at boot with fixed world
// positions; destroyed blocks/guards stay destroyed for the rest of the
// session. Hitting a block or guard always saps velocity; only a hit above
// BLOCK_BREAK_SPEED actually breaks it -- otherwise it's just a solid bump.
// ============================================================================
const BLOCK_SIZE = 28;
const FORT_COUNT = 55;
const BLOCK_BREAK_SPEED = 5;
const BOMB_RADIUS = 5 * BLOCK_SIZE;
const ROCKET_EXPLOSION_RADIUS = 2.2 * BLOCK_SIZE;
const BOMBHEAD_RADIUS = 2 * BLOCK_SIZE;
let forts = [];
let projectiles = [];
let rockets = [];

// Sky islands: fort platforms floating ISLAND_HEIGHT_M above the local
// terrain, never registered in flatZones (so the ground itself never
// bulges up to meet them) -- pure `forts` entries with an unbreakable
// 'island' base, rendered as one cohesive landmass by drawIslandLand()
// rather than individual blocks. See generateIslandFort() below.
const ISLAND_HEIGHT_M = 100;
const ISLAND_BASE_ROWS = 2;
const ISLAND_SPACING_M = 340;
const ISLAND_COUNT = 14;

// Preset rows: '1' = a normal block (material rolled by rollMaterial()),
// '0' = empty, 'S' = a Spring defense block -- indestructible, and instead
// of breaking or damping the player it launches them back out along the
// hit surface's normal (see handleSpring() below).
const FORT_PRESETS = [
    // Tower, 52 blocks
    ['111111111', '111111111', '111111111', '111111111', '101111101', '101110101', '100010001'],
    // Pyramid, 64 blocks
    ['111111111111111', '011111111111110', '001111111111100', '000111111111000', '000011111110000', '000001111100000', '000000111000000', '000000010000000'],
    // Wall with crenellations, 63 blocks
    ['11111111111111', '11111111111111', '11111111111111', '11111111111111', '10101010101010'],
    // Twin towers, 51 blocks
    ['111111111', '111111111', '111111111', '110000011', '110000011', '110000011', '110000011', '110000011', '110000011'],
    // Staircase, 68 blocks
    ['111111111111', '111111111110', '111111111100', '111111111000', '111111110000', '111111100000', '111111000000', '111110000000'],
    // Springboard Wall
    ['111111111111', '111111111111', 'S1111111111S', '111111111111', 'S1S1S1S1S1S1'],
    // Bounce Tower
    ['111111111', '1S1111S1S', '111111111', 'S11111111', '111S111S1', '111111111', 'S1S111S1S'],
    // Trampoline Yard
    ['1S1S1S1S1S1S', '111111111111', 'S111111111S1', '111111111111', 'S1S111S1S1S1'],
];

function rollMaterial() {
    let r = Math.random();
    if (r < 0.05) return 'tnt';
    if (r < 0.30) return 'stone';
    return 'wood';
}

function makeGuard(x, y, col, type) {
    return { x, y, vy: 0, col, type, alive: true, shootCooldown: 40 + Math.random() * 80 };
}

function buildBlocksAndGuards(x, plateauHeight, preset) {
    let width = preset[0].length;
    let blocks = [];
    let tallestRow = -1, tallestCol = 0;
    for (let row = 0; row < preset.length; row++) {
        let rowStr = preset[row];
        for (let col = 0; col < rowStr.length; col++) {
            let ch = rowStr[col];
            if (ch !== '1' && ch !== 'S') continue;
            let bx = x + (col - (width - 1) / 2) * BLOCK_SIZE;
            blocks.push({
                alive: true, material: ch === 'S' ? 'spring' : rollMaterial(), col, row,
                x: bx, y: plateauHeight - (row + 1) * BLOCK_SIZE, vy: 0,
            });
            if (row > tallestRow) { tallestRow = row; tallestCol = col; }
        }
    }
    return { blocks, width, tallestRow, tallestCol };
}

// A floating fort: a solid, unbreakable 'island' base (ISLAND_BASE_ROWS deep,
// slightly wider than the preset so it reads as a chunk of rock) with a
// normal preset built on top, at a height with nothing connecting it to the
// ground. Never registers a flatZone -- the terrain below stays untouched.
function generateIslandFort(x) {
    let groundY = naturalGroundY(x);
    let floatPx = ISLAND_HEIGHT_M * pixelsPerMeter;
    let plateauHeight = groundY - floatPx;

    let preset = FORT_PRESETS[Math.floor(Math.random() * FORT_PRESETS.length)];
    let built = buildBlocksAndGuards(x, plateauHeight, preset);

    let baseBlocks = [];
    let margin = 1;
    for (let col = -margin; col < built.width + margin; col++) {
        let bx = x + (col - (built.width - 1) / 2) * BLOCK_SIZE;
        for (let r = 1; r <= ISLAND_BASE_ROWS; r++) {
            baseBlocks.push({
                alive: true, material: 'island', col, row: -r,
                x: bx, y: plateauHeight + (r - 1) * BLOCK_SIZE, vy: 0,
            });
        }
    }

    let guards = [];
    if (Math.random() < 0.85) {
        let guardType = Math.random() < 0.4 ? 'shooter' : 'passive';
        let guardX = x + (built.tallestCol - (built.width - 1) / 2) * BLOCK_SIZE;
        guards.push(makeGuard(guardX, plateauHeight - (built.tallestRow + 1) * BLOCK_SIZE - 34, built.tallestCol, guardType));
    }

    return {
        x, baseY: plateauHeight, blocks: [...baseBlocks, ...built.blocks], guards,
        isBoss: false, isIsland: true,
        collisionRadius: ((built.width + margin * 2) * BLOCK_SIZE) / 2 + 40,
    };
}

// A wide, heavily-guarded fortress placed every BOSS_SPACING_M meters:
// one column of blocks per "column slot", corner towers and alternating
// merlons for a castle-wall silhouette, and a shooter/gunner guard
// standing on every single column's top block.
const BOSS_WIDTH = 24;
function generateBossFort(x) {
    const plateauHeight = naturalGroundY(x);
    const halfWidth = (BOSS_WIDTH * BLOCK_SIZE) / 2 + 30;
    flatZones.push({ x, halfWidth, blend: 150, height: plateauHeight });

    let blocks = [];
    let guards = [];
    for (let col = 0; col < BOSS_WIDTH; col++) {
        let h = (col === 0 || col === BOSS_WIDTH - 1) ? 18 : (col % 2 === 0 ? 14 : 10);
        let bx = x + (col - (BOSS_WIDTH - 1) / 2) * BLOCK_SIZE;
        for (let row = 0; row < h; row++) {
            blocks.push({
                alive: true, material: rollMaterial(), col, row,
                x: bx, y: plateauHeight - (row + 1) * BLOCK_SIZE, vy: 0,
            });
        }
        guards.push(makeGuard(bx, plateauHeight - h * BLOCK_SIZE - 34, col, 'shooter'));
    }

    return {
        x, baseY: plateauHeight, blocks, guards, isBoss: true,
        collisionRadius: halfWidth + 40,
    };
}

const BOSS_SPACING_M = 500;
const BOSS_COUNT = 10;

function generateForts() {
    forts = [];
    flatZones = [];

    let bossSpacingPx = BOSS_SPACING_M * pixelsPerMeter;
    let bossPositions = [];
    for (let i = 1; i <= BOSS_COUNT; i++) {
        let bx = player.startX + i * bossSpacingPx;
        bossPositions.push(bx);
        forts.push(generateBossFort(bx));
    }

    function tooCloseToBoss(x) {
        return bossPositions.some((b) => Math.abs(x - b) < 1000);
    }

    let x = player.startX + 900;
    for (let i = 0; i < FORT_COUNT; i++) {
        x += 900 + Math.random() * 900;
        while (tooCloseToBoss(x)) x += 400;

        let preset = FORT_PRESETS[Math.floor(Math.random() * FORT_PRESETS.length)];
        let plateauHeight = naturalGroundY(x);
        let built = buildBlocksAndGuards(x, plateauHeight, preset);
        flatZones.push({ x, halfWidth: (built.width * BLOCK_SIZE) / 2 + 24, blend: 130, height: plateauHeight });

        let guards = [];
        if (Math.random() < 0.75) {
            let guardType = Math.random() < 0.2 ? 'shooter' : 'passive';
            let guardX = x + (built.tallestCol - (built.width - 1) / 2) * BLOCK_SIZE;
            guards.push(makeGuard(guardX, plateauHeight - (built.tallestRow + 1) * BLOCK_SIZE - 34, built.tallestCol, guardType));
        }

        forts.push({
            x, baseY: plateauHeight, blocks: built.blocks, guards, isBoss: false,
            collisionRadius: (built.width * BLOCK_SIZE) / 2 + 40,
        });
    }

    let ix = player.startX + 1400;
    for (let i = 0; i < ISLAND_COUNT; i++) {
        ix += (ISLAND_SPACING_M + Math.random() * ISLAND_SPACING_M * 0.8) * pixelsPerMeter;
        forts.push(generateIslandFort(ix));
    }

    forts.sort((a, b) => a.x - b.x);
}

// Settles blocks/guards straight down onto whatever's still alive beneath
// them (ground or another block), closing gaps left by destroyed blocks.
function updateFortPhysics() {
    forts.forEach((fort) => {
        let columns = {};
        fort.blocks.forEach((b) => {
            if (!b.alive) return;
            (columns[b.col] = columns[b.col] || []).push(b);
        });

        Object.keys(columns).forEach((colKey) => {
            let colBlocks = columns[colKey];
            colBlocks.sort((a, b) => a.row - b.row);
            colBlocks.forEach((b, idx) => {
                let targetY = fort.baseY - (idx + 1) * BLOCK_SIZE;
                if (b.y < targetY - 0.5) {
                    b.vy += gravity * 0.6;
                    b.y = Math.min(b.y + b.vy, targetY);
                    if (b.y >= targetY) b.vy = 0;
                } else {
                    b.y = targetY;
                    b.vy = 0;
                }
            });
        });

        fort.guards.forEach((g) => {
            if (!g.alive) return;
            let support = columns[g.col] || [];
            let targetY = fort.baseY - support.length * BLOCK_SIZE - 34;
            if (g.y < targetY - 0.5) {
                g.vy += gravity * 0.6;
                g.y = Math.min(g.y + g.vy, targetY);
                if (g.y >= targetY) g.vy = 0;
            } else {
                g.y = targetY;
                g.vy = 0;
            }
        });
    });
}

function resolveCircleBox(px, py, r, bx, by, bw, bh) {
    let closestX = clamp(px, bx, bx + bw);
    let closestY = clamp(py, by, by + bh);
    let dx = px - closestX, dy = py - closestY;
    let distSq = dx * dx + dy * dy;
    if (distSq >= r * r) return null;
    let dist = Math.sqrt(distSq);
    let nx = dist > 0.0001 ? dx / dist : 0;
    let ny = dist > 0.0001 ? dy / dist : -1;
    return { nx, ny, penetration: r - dist };
}

// Pushes `body` out of the hit box, then either lets it punch through (mild
// slowdown) or bounces it off (heavy slowdown), depending on speed. `body`
// is the main player or a mini shard -- both are plain {x,y,vx,vy,radius,
// stuckTicks,breakMult} objects, so the same function serves either.
// Natural bounce damping lets speed decay to a genuine stop when resting on
// top of a block (needed so landing can trigger there -- see the stopping
// condition in update()); the stuckTicks counter in checkFortCollisions is
// the backstop for a hit that never resolves (e.g. wedged against a side).
function resolveFortHit(body, hit) {
    body.x += hit.nx * (hit.penetration + 0.5);
    body.y += hit.ny * (hit.penetration + 0.5);

    let speed = Math.hypot(body.vx, body.vy);
    if (speed > BLOCK_BREAK_SPEED * (body.breakMult || 1)) {
        body.vx *= 0.85;
        body.vy *= 0.85;
        return true;
    }
    let vDotN = body.vx * hit.nx + body.vy * hit.ny;
    body.vx -= 2 * vDotN * hit.nx;
    body.vy -= 2 * vDotN * hit.ny;
    body.vx *= 0.5;
    body.vy *= 0.5;

    return false;
}

// Same push-out-and-damp shape as the bounce branch above, but with no
// break check at all -- used for permanently solid geometry (island bases).
function resolveFortHitSolid(body, hit) {
    body.x += hit.nx * (hit.penetration + 0.5);
    body.y += hit.ny * (hit.penetration + 0.5);
    let vDotN = body.vx * hit.nx + body.vy * hit.ny;
    body.vx -= 2 * vDotN * hit.nx;
    body.vy -= 2 * vDotN * hit.ny;
    body.vx *= 0.5;
    body.vy *= 0.5;
}

const SPRING_LAUNCH_SPEED = 14;
const SPRING_BOUNCE_SPREAD = 0.26; // radians, ~15 degrees either side
const SPRING_BREAK_SPEED = 30; // hit it this fast and it shatters instead of bouncing (base max launch is 25)
const SPRING_REWARD = 5;
function playSpring() { beep({ freq: 500, freqEnd: 1100, duration: 0.1, type: 'triangle', gain: 0.14 }); }
function playSpringBreak() {
    beep({ freq: 700, freqEnd: 1400, duration: 0.07, type: 'triangle', gain: 0.14 });
    setTimeout(() => beep({ freq: 260, freqEnd: 90, duration: 0.09, type: 'square', gain: 0.11 }), 45);
}

// Springs mostly launch `body` back out along the hit surface's normal, with
// a small random jitter to the angle so repeated bounces don't feel
// perfectly mechanical, at a speed that's gentler than before -- a bounce,
// not a launch.
function handleSpring(body, block, hit) {
    body.x += hit.nx * (hit.penetration + 1);
    body.y += hit.ny * (hit.penetration + 1);
    let incoming = Math.hypot(body.vx, body.vy);
    let boosted = Math.max(incoming * 0.9, SPRING_LAUNCH_SPEED * 0.55) + SPRING_LAUNCH_SPEED * 0.25;
    let normalAngle = Math.atan2(hit.ny, hit.nx);
    let launchAngle = normalAngle + (Math.random() * 2 - 1) * SPRING_BOUNCE_SPREAD;
    body.vx = Math.cos(launchAngle) * boosted;
    body.vy = Math.sin(launchAngle) * boosted;
    spawnDust(block.x, block.y + BLOCK_SIZE / 2, 12, '#43D9C8');
    spawnFloater(body.x, body.y - 22, 'BOING!', '#43D9C8');
    playSpring();
    triggerShake(6);
}

function playBlockBreak() { beep({ freq: 300, freqEnd: 120, duration: 0.08, type: 'square', gain: 0.11 }); }
function playGuardHit() {
    beep({ freq: 200, freqEnd: 60, duration: 0.12, type: 'sawtooth', gain: 0.16 });
    setTimeout(() => beep({ freq: 660, duration: 0.08, type: 'square', gain: 0.1 }), 60);
}
function playShoot() { beep({ freq: 500, freqEnd: 250, duration: 0.07, type: 'triangle', gain: 0.09 }); }
function playProjectileHit() { beep({ freq: 180, freqEnd: 40, duration: 0.14, type: 'sawtooth', gain: 0.15 }); }
function playExplosion() {
    beep({ freq: 150, freqEnd: 40, duration: 0.22, type: 'sawtooth', gain: 0.2 });
    setTimeout(() => beep({ freq: 80, freqEnd: 30, duration: 0.18, type: 'square', gain: 0.15 }), 40);
}

const TNT_PUSH = 13;
const BLOCK_REWARD = 1;   // wood or stone
const TNT_REWARD = 3;
const GUARD_REWARD = 5;
const SHOOTER_REWARD = 8;

// TNT takes out its 4 orthogonal neighbors (no chain reaction, even if one
// of them is also TNT -- keeps the blast radius predictable) and shoves
// `body` away from the blast center.
function explodeTnt(body, fort, block) {
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dc, dr]) => {
        let target = fort.blocks.find((b) => b.alive && b.material !== 'island' && b.material !== 'spring' && b.col === block.col + dc && b.row === block.row + dr);
        if (!target) return;
        target.alive = false;
        if (target.material === 'tnt') tntBlocksDestroyed++;
        else if (target.material === 'stone') stoneBlocksDestroyed++;
        else woodBlocksDestroyed++;
        spawnDust(target.x, target.y + BLOCK_SIZE / 2, 10, '#f97316');
    });
    maybeCompleteFort(fort);

    let dx = body.x - block.x, dy = body.y - (block.y + BLOCK_SIZE / 2);
    let dist = Math.hypot(dx, dy) || 1;
    body.vx += (dx / dist) * TNT_PUSH;
    body.vy += (dy / dist) * TNT_PUSH - TNT_PUSH * 0.3;

    spawnDust(block.x, block.y + BLOCK_SIZE / 2, 30, '#f97316');
    triggerShake(12);
    playExplosion();
}

// Fires once, the moment every block AND guard in a fort is gone -- feeds
// both the lifetime Achievements stats and this run's daily-challenge tally.
function maybeCompleteFort(fort) {
    if (fort.counted) return;
    if (fort.blocks.some((b) => b.alive && b.material !== 'island') || fort.guards.some((g) => g.alive)) return;
    fort.counted = true;
    lifetimeStats.fortsDestroyed++;
    fortsFullyDestroyedThisRun++;
    if (fort.isBoss) { lifetimeStats.bossFortsDestroyed++; bossFullyDestroyedThisRun++; }
}

// Destroys any alive block/guard within `radius` px of (cx, cy), across every
// fort close enough to matter, crediting the same per-run counters as any
// other destruction. Shared by bomb head and rocket-head explosions below.
function destroyInRadius(cx, cy, radius, dustColor) {
    forts.forEach((fort) => {
        if (Math.abs(fort.x - cx) > radius + fort.collisionRadius) return;
        fort.blocks.forEach((block) => {
            if (!block.alive || block.material === 'island' || block.material === 'spring') return;
            let by = block.y + BLOCK_SIZE / 2;
            if (Math.hypot(block.x - cx, by - cy) > radius) return;
            block.alive = false;
            if (block.material === 'tnt') tntBlocksDestroyed++;
            else if (block.material === 'stone') stoneBlocksDestroyed++;
            else woodBlocksDestroyed++;
            spawnDust(block.x, by, 6, dustColor);
        });
        fort.guards.forEach((g) => {
            if (!g.alive) return;
            let gy = g.y + 17;
            if (Math.hypot(g.x - cx, gy - cy) > radius) return;
            g.alive = false;
            if (g.type === 'shooter') { armedGuardsDestroyed++; lifetimeStats.armedGuardsKilled++; }
            else guardsDestroyed++;
            spawnDust(g.x, gy, 8, '#ef4444');
        });
        maybeCompleteFort(fort);
    });
}

function triggerBombHead() {
    if (activePower !== 'bomb' || powerUsed || state !== 'FLYING') return;
    powerUsed = true;
    updatePowerUI();

    destroyInRadius(player.x, player.y, BOMB_RADIUS, '#f97316');

    spawnDust(player.x, player.y, 46, '#f97316');
    spawnFloater(player.x, player.y - 26, 'BOOM!', '#f97316');
    triggerShake(18);
    playExplosion();
}

function playRocketLaunch() {
    beep({ freq: 300, freqEnd: 700, duration: 0.12, type: 'sawtooth', gain: 0.13 });
    setTimeout(() => beep({ freq: 350, freqEnd: 750, duration: 0.12, type: 'sawtooth', gain: 0.1 }), 40);
}

function triggerRocketHead() {
    if (activePower !== 'rocket' || powerUsed || state !== 'FLYING') return;
    powerUsed = true;
    updatePowerUI();

    let dirX = Math.cos(ROCKET_ANGLE), dirY = Math.sin(ROCKET_ANGLE);
    let perpX = -dirY, perpY = dirX;
    let speed = 12, spacing = 20;
    for (let i = -1; i <= 1; i++) {
        rockets.push({
            x: player.x + perpX * i * spacing,
            y: player.y + perpY * i * spacing,
            vx: dirX * speed, vy: dirY * speed,
            life: 220,
        });
    }
    playRocketLaunch();
}

function updateRockets() {
    for (let i = rockets.length - 1; i >= 0; i--) {
        let r = rockets[i];
        r.x += r.vx;
        r.y += r.vy;
        r.life--;

        let exploded = false;
        for (let f = 0; f < forts.length && !exploded; f++) {
            let fort = forts[f];
            if (Math.abs(fort.x - r.x) > fort.collisionRadius) continue;
            for (let b = 0; b < fort.blocks.length && !exploded; b++) {
                let block = fort.blocks[b];
                if (block.alive && resolveCircleBox(r.x, r.y, 5, block.x - BLOCK_SIZE / 2, block.y, BLOCK_SIZE, BLOCK_SIZE)) exploded = true;
            }
            for (let g = 0; g < fort.guards.length && !exploded; g++) {
                let guard = fort.guards[g];
                if (guard.alive && resolveCircleBox(r.x, r.y, 5, guard.x - 10, guard.y, 20, 34)) exploded = true;
            }
        }

        if (exploded) {
            destroyInRadius(r.x, r.y, ROCKET_EXPLOSION_RADIUS, '#f97316');
            spawnDust(r.x, r.y, 22, '#f97316');
            triggerShake(7);
            playExplosion();
        }

        if (exploded || r.life <= 0) rockets.splice(i, 1);
    }
}

function drawRockets() {
    rockets.forEach((r) => {
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(ROCKET_ANGLE);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-9, -3, 16, 6);
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(7, -3.5);
        ctx.lineTo(13, 0);
        ctx.lineTo(7, 3.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });
}

const STUCK_LIMIT = 20; // ~0.33s -- backstop for genuine wedge/corner cases;
                        // a normal rest-on-top landing converges naturally
                        // well before this (verified: ~25 ticks to settle).
                        // Tracked per-body (body.stuckTicks) so a mini shard
                        // wedged somewhere never affects the main player.

// A read-only version of the overlap test used by checkFortCollisions --
// no push-out, no damping, just "is `body` currently touching (or within a
// hair of touching) any alive block/guard". Used as a landing fallback: once
// velocity has damped down near zero while resting on an uneven or elevated
// surface (a boss fort's crenellated top, say), successive collision
// resolutions can leave the player sitting exactly at the boundary -- no
// longer geometrically overlapping, so checkFortCollisions legitimately
// finds nothing that tick. touchedFort alone can then flicker false right
// when velocity finally settles, and since heightM is always well above
// LANDING_HEIGHT_LIMIT up on a tall fort, neither landing condition fires
// and the run never ends. The +2px pad here covers exactly that "just
// clear of the surface" resting gap.
function isTouchingFort(x, y, r) {
    let pad = r + 2;
    for (let f = 0; f < forts.length; f++) {
        let fort = forts[f];
        if (Math.abs(fort.x - x) > fort.collisionRadius) continue;
        for (let b = 0; b < fort.blocks.length; b++) {
            let block = fort.blocks[b];
            if (block.alive && resolveCircleBox(x, y, pad, block.x - BLOCK_SIZE / 2, block.y, BLOCK_SIZE, BLOCK_SIZE)) return true;
        }
        for (let g = 0; g < fort.guards.length; g++) {
            let guard = fort.guards[g];
            if (guard.alive && resolveCircleBox(x, y, pad, guard.x - 10, guard.y, 20, 34)) return true;
        }
    }
    return false;
}

function checkFortCollisions(body) {
    let anyHit = false;
    // Captured once, before any block in this pass has damped the body's
    // speed -- springs sit embedded in walls of ordinary blocks, and those
    // neighbors usually get processed first (each punch-through saps 15%),
    // which would otherwise drop a genuinely very fast hit just under
    // SPRING_BREAK_SPEED by the time the spring itself is evaluated.
    let entrySpeed = Math.hypot(body.vx, body.vy);

    for (let f = 0; f < forts.length; f++) {
        let fort = forts[f];
        if (Math.abs(fort.x - body.x) > fort.collisionRadius) continue;

        for (let b = 0; b < fort.blocks.length; b++) {
            let block = fort.blocks[b];
            if (!block.alive) continue;
            let hit = resolveCircleBox(body.x, body.y, body.radius, block.x - BLOCK_SIZE / 2, block.y, BLOCK_SIZE, BLOCK_SIZE);
            if (!hit) continue;
            anyHit = true;
            if (fort.isIsland && body === player) touchedIslandThisFlight = true;

            if (block.material === 'spring') {
                if (entrySpeed > SPRING_BREAK_SPEED) {
                    block.alive = false;
                    springsDestroyed++;
                    spawnDust(block.x, block.y + BLOCK_SIZE / 2, 18, '#134e4a');
                    spawnFloater(body.x, body.y - 22, `+$${SPRING_REWARD}`, '#43D9C8');
                    playSpringBreak();
                    triggerShake(7);
                    body.vx *= 0.85;
                    body.vy *= 0.85;
                    maybeCompleteFort(fort);
                } else {
                    handleSpring(body, block, hit);
                }
                continue;
            }
            if (block.material === 'island') {
                resolveFortHitSolid(body, hit);
                continue;
            }

            let broke = resolveFortHit(body, hit) || body.stuckTicks > STUCK_LIMIT;
            if (broke) {
                block.alive = false;
                if (block.material === 'tnt') tntBlocksDestroyed++;
                else if (block.material === 'stone') stoneBlocksDestroyed++;
                else woodBlocksDestroyed++;
                let reward = block.material === 'tnt' ? TNT_REWARD : BLOCK_REWARD;
                spawnDust(block.x, block.y + BLOCK_SIZE / 2, block.material === 'tnt' ? 22 : 8, block.material === 'tnt' ? '#f97316' : '#a9784f');
                spawnFloater(body.x, body.y - 20, `+$${reward}`, '#c99a63');
                playBlockBreak();
                triggerShake(block.material === 'tnt' ? 7 : 3);
                if (block.material === 'tnt') explodeTnt(body, fort, block);
                else maybeCompleteFort(fort);
            } else {
                spawnDust(block.x, block.y + BLOCK_SIZE / 2, 4);
                triggerShake(2);
            }
        }

        for (let g = 0; g < fort.guards.length; g++) {
            let guard = fort.guards[g];
            if (!guard.alive) continue;
            let hit = resolveCircleBox(body.x, body.y, body.radius, guard.x - 10, guard.y, 20, 34);
            if (!hit) continue;
            anyHit = true;
            if (fort.isIsland && body === player) touchedIslandThisFlight = true;
            let broke = resolveFortHit(body, hit) || body.stuckTicks > STUCK_LIMIT;
            if (broke) {
                guard.alive = false;
                if (guard.type === 'shooter') { armedGuardsDestroyed++; lifetimeStats.armedGuardsKilled++; }
                else guardsDestroyed++;
                let reward = guard.type === 'shooter' ? SHOOTER_REWARD : GUARD_REWARD;
                spawnDust(guard.x, guard.y + 17, 14);
                spawnFloater(body.x, body.y - 20, `+$${reward}`, '#ef4444');
                playGuardHit();
                triggerShake(6);
                maybeCompleteFort(fort);
            } else {
                spawnDust(guard.x, guard.y + 17, 4);
                triggerShake(2);
            }
        }
    }

    body.stuckTicks = anyHit ? body.stuckTicks + 1 : 0;
    return anyHit;
}

// ============================================================================
// Minis (character type) -- splitting the main player into shard bodies
// ============================================================================
function triggerMiniSplit() {
    if (playerType !== 'mini' || miniSplitUsed || state !== 'FLYING') return;
    miniSplitUsed = true;
    updatePowerUI();

    let baseSpeed = Math.hypot(player.vx, player.vy) || 6;
    let baseAngle = Math.atan2(player.vy, player.vx);
    [-0.38, 0, 0.38].forEach((offset) => {
        miniShards.push({
            x: player.x, y: player.y,
            vx: Math.cos(baseAngle + offset) * baseSpeed * 0.9,
            vy: Math.sin(baseAngle + offset) * baseSpeed * 0.9,
            radius: player.radius * MINI_SCALE,
            rotation: player.rotation,
            stuckTicks: 0, breakMult: 1,
            life: 500, settled: false, settleTimer: 0,
        });
    });
    spawnDust(player.x, player.y, 22, '#7dd3fc');
    spawnFloater(player.x, player.y - 26, 'SPLIT!', '#7dd3fc');
    triggerShake(6);
    playRocketLaunch();

    // Purely decorative: the now-empty bag tumbles down and vanishes on its
    // own timer -- no collision, no reward, just flavor for the split.
    miniBagDrop = {
        x: player.x, y: player.y,
        vx: (Math.random() - 0.5) * 3, vy: -2,
        rotation: 0, angVel: (Math.random() - 0.5) * 0.3,
        life: 80,
    };
}

// Shards run a simplified version of the main flight physics: gravity +
// upgrade-level aero drag (no character drag multiplier -- Minis' own
// dragMult is neutral anyway), real fort collisions via checkFortCollisions
// so they still earn destruction credit, and a soft ground bounce. They
// never drive the camera, HUD, or the run's landing trigger.
function updateMiniShards() {
    for (let i = miniShards.length - 1; i >= 0; i--) {
        let s = miniShards[i];
        if (s.settled) {
            s.settleTimer--;
            if (s.settleTimer <= 0) miniShards.splice(i, 1);
            continue;
        }

        s.vy += gravity;
        s.vx *= upgrades.aero.value;
        s.vy *= upgrades.aero.value;

        let steps = Math.min(6, Math.max(1, Math.ceil(Math.hypot(s.vx, s.vy) / 18)));
        for (let st = 0; st < steps; st++) {
            s.x += s.vx / steps;
            s.y += s.vy / steps;
            s.rotation += (s.vx / steps) * 0.02;
            checkFortCollisions(s);

            let cg = getGroundY(s.x);
            if (s.y >= cg - s.radius) {
                s.y = cg - s.radius;
                if (Math.abs(s.vy) > 2) { s.vy = -s.vy * 0.4; s.vx *= groundFriction; }
                else s.vy = 0;
            }
        }

        s.life--;
        if (s.life <= 0 || (Math.abs(s.vx) < 0.15 && Math.abs(s.vy) < 0.15 && s.y >= getGroundY(s.x) - s.radius - 2)) {
            s.settled = true;
            s.settleTimer = 50;
        }
    }
}

// The empty bag dropped by triggerMiniSplit() -- tumbles under gravity with
// no collision or gameplay effect at all, and just clears itself once its
// timer runs out.
function updateMiniBagDrop() {
    if (!miniBagDrop) return;
    miniBagDrop.vy += gravity;
    miniBagDrop.x += miniBagDrop.vx;
    miniBagDrop.y += miniBagDrop.vy;
    miniBagDrop.rotation += miniBagDrop.angVel;
    miniBagDrop.life--;
    if (miniBagDrop.life <= 0) miniBagDrop = null;
}

function updateShooterGuards() {
    if (state !== 'FLYING') return;
    forts.forEach((fort) => {
        fort.guards.forEach((g) => {
            if (g.type !== 'shooter' || !g.alive) return;
            g.shootCooldown--;
            let dx = player.x - g.x, dy = player.y - g.y;
            let dist = Math.hypot(dx, dy) || 1;
            if (g.shootCooldown <= 0 && dist < 750 && dx < 40) {
                let speed = 15;
                projectiles.push({ x: g.x, y: g.y - 20, vx: (dx / dist) * speed, vy: (dy / dist) * speed, life: 150 });
                g.shootCooldown = 55;
                playShoot();
            }
        });
    });
}

function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (state === 'FLYING' && Math.hypot(p.x - player.x, p.y - player.y) < player.radius + 5) {
            player.vx *= 0.55;
            player.vy *= 0.55;
            cash = Math.max(0, cash - 1);
            updateHUD();
            spawnDust(player.x, player.y, 10, '#c084fc');
            spawnFloater(player.x, player.y - 20, '-$1 HIT!', '#c084fc');
            playProjectileHit();
            triggerShake(5);
            projectiles.splice(i, 1);
            continue;
        }
        if (p.life <= 0) projectiles.splice(i, 1);
    }
}

// ============================================================================
// Aiming helpers -- shared by the main-canvas trajectory preview and the
// minimap aim indicator so both always agree on where a launch will go.
// ============================================================================
function getDragVelocity() {
    let dx = dragStartX - dragCurrentX;
    let dy = dragStartY - dragCurrentY;
    let dist = Math.sqrt(dx * dx + dy * dy);
    let maxDrag = 200;
    if (dist > maxDrag) {
        dx = (dx / dist) * maxDrag;
        dy = (dy / dist) * maxDrag;
    }
    let powerScale = (upgrades.power.value * player.powerMult) / maxDrag;
    return { dx, dy, vx: dx * powerScale, vy: dy * powerScale };
}

function getEffectiveAero() {
    return clamp(1 - (1 - upgrades.aero.value) * player.aeroDragMult, 0.85, 0.999);
}

// Simplified (non-substepped) forward simulation, run only while aiming --
// cheap enough to do every rendered frame. Ignores forts; it's a guide, not
// an exact replay of the real physics. Samples points along the way so the
// minimap can draw the actual arc instead of a straight shortcut line.
function predictTrajectoryPoints(vx, vy) {
    let points = [{ x: player.x, y: player.y }];
    let tx = player.x, ty = player.y;
    let tvx = vx, tvy = vy;
    let aero = getEffectiveAero();
    for (let i = 0; i < 2000; i++) {
        tvy += gravity * player.gravityMult;
        tvx *= aero;
        tvy *= aero;
        tx += tvx;
        ty += tvy;
        let cgy = getGroundY(tx);
        if (ty >= cgy) {
            ty = cgy;
            if (Math.abs(tvy) > 2) {
                tvy = -tvy * Math.min(0.85, upgrades.bounce.value);
            } else {
                tvy = 0;
            }
            tvx *= groundFriction;
        }
        if (i % 14 === 0) points.push({ x: tx, y: ty });
        if (Math.abs(tvx) < 0.2 && Math.abs(tvy) < 0.5 && ty >= cgy - 2) break;
    }
    points.push({ x: tx, y: ty });
    return points;
}

function predictLandingX(vx, vy) {
    let points = predictTrajectoryPoints(vx, vy);
    return points[points.length - 1].x;
}

// ============================================================================
// Resize
// ============================================================================
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    // The minimap has its own canvas -- keep its backing store matched to
    // its actual rendered box so it stays crisp at any size.
    let mapRect = minimapCanvas.getBoundingClientRect();
    if (mapRect.width > 0 && mapRect.height > 0) {
        minimapCanvas.width = mapRect.width;
        minimapCanvas.height = mapRect.height;
    }
}
window.addEventListener('resize', resize);

// ============================================================================
// Economy helpers
// ============================================================================
function formatMoney(amount) {
    return Math.floor(amount).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function getCost(key) {
    let u = upgrades[key];
    return Math.floor(u.baseCost * Math.pow(u.costMult, u.level - 1));
}

function buyUpgrade(key) {
    let cost = getCost(key);
    let u = upgrades[key];
    if (cash >= cost && (!u.maxLvl || u.level < u.maxLvl)) {
        cash -= cost;
        u.level++;
        if (key === 'aero') u.value = Math.min(0.995, u.value + u.valStep);
        else if (key === 'power') u.value += u.valStep;
        else if (key === 'bounce') u.value = Math.min(0.85, u.value + u.valStep);
        else if (key === 'mult') u.value += u.valStep;
        else if (key === 'jetpack') { u.value += u.valStep; jetpackFuel = u.value; }
        updateShopUI();
        updateHUD();
        saveGame();
    }
}

// Persists cash, best distance, and upgrade levels through CrazyGames' data
// module (see CrazySDK.saveProgress/loadProgress) -- no-ops standalone.
function saveGame() {
    CrazySDK.saveProgress({
        cash,
        bestRunX,
        upgrades: {
            power: { level: upgrades.power.level, value: upgrades.power.value },
            aero: { level: upgrades.aero.level, value: upgrades.aero.value },
            bounce: { level: upgrades.bounce.level, value: upgrades.bounce.value },
            mult: { level: upgrades.mult.level, value: upgrades.mult.value },
            jetpack: { level: upgrades.jetpack.level, value: upgrades.jetpack.value },
        },
        playerType, unlockedTypes, selectedCostume, unlockedCostumes,
        lifetimeStats, unlockedAchievements, dailyState,
    });
}

function loadGame() {
    let data = CrazySDK.loadProgress();
    if (!data) return;
    if (typeof data.cash === 'number') cash = data.cash;
    if (typeof data.bestRunX === 'number') bestRunX = data.bestRunX;
    if (data.upgrades) {
        Object.keys(upgrades).forEach((key) => {
            if (data.upgrades[key]) {
                upgrades[key].level = data.upgrades[key].level;
                upgrades[key].value = data.upgrades[key].value;
            }
        });
    }
    if (typeof data.playerType === 'string' && STICKMAN_TYPES[data.playerType]) playerType = data.playerType;
    if (Array.isArray(data.unlockedTypes)) unlockedTypes = data.unlockedTypes;
    if (typeof data.selectedCostume === 'string' && COSTUMES[data.selectedCostume]) selectedCostume = data.selectedCostume;
    if (Array.isArray(data.unlockedCostumes)) unlockedCostumes = data.unlockedCostumes;
    if (data.lifetimeStats) Object.assign(lifetimeStats, data.lifetimeStats);
    if (Array.isArray(data.unlockedAchievements)) unlockedAchievements = data.unlockedAchievements;
    if (data.dailyState) dailyState = data.dailyState;
    jetpackFuel = upgrades.jetpack.value; // keep fuel in sync with the loaded upgrade
}

// ============================================================================
// Input handling
// ============================================================================
canvas.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', doDrag);
window.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', (e) => {
    if (e.cancelable) e.preventDefault();
    if (e.touches && e.touches[0]) startDrag(e.touches[0]);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (isDragging && e.cancelable) e.preventDefault();
    if (isDragging && e.touches && e.touches[0]) doDrag(e.touches[0]);
}, { passive: false });

window.addEventListener('touchend', endDrag);

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        thrustHeld = true;
        if (e.cancelable) e.preventDefault();
    } else if (e.code === 'KeyB') {
        if (activePower === 'bomb') triggerBombHead();
        else if (activePower === 'rocket') triggerRocketHead();
        else if (playerType === 'mini') triggerMiniSplit();
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') thrustHeld = false;
});

function startDrag(e) {
    if (state === 'FLYING') {
        ensureAudio();
        thrustHeld = true;
        return;
    }
    if (state !== 'AIMING') return;
    ensureAudio();
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragCurrentX = dragStartX;
    dragCurrentY = dragStartY;
    shopBar.classList.remove('show');
    rewardBtn.classList.remove('show');
    powerAdBtn.classList.remove('show');
    recordingDownloadEl.classList.remove('show');
}

function doDrag(e) {
    if (!isDragging || state !== 'AIMING') return;
    dragCurrentX = e.clientX;
    dragCurrentY = e.clientY;
}

function endDrag() {
    thrustHeld = false;
    if (!isDragging || state !== 'AIMING') return;
    isDragging = false;

    let dx = dragStartX - dragCurrentX;
    let dy = dragStartY - dragCurrentY;

    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        shopBar.classList.add('show');
        if (!rewardUsedThisRun) rewardBtn.classList.add('show');
        return;
    }

    let launch = getDragVelocity();
    player.vx = launch.vx;
    player.vy = launch.vy;
    lastAimDx = launch.dx;
    lastAimDy = launch.dy;
    hasLastAim = true;

    state = 'FLYING';
    aimHint.classList.add('hidden');
    playLaunch();

    if (recordArmed && canRecord()) startRecording();

    if (!hasLaunchedOnce) {
        hasLaunchedOnce = true;
        document.body.classList.remove('pre-launch');
    }
}

// ============================================================================
// Reset / physics / landing
// ============================================================================
// Snapshots the currently-selected stickman type's multipliers onto the
// player object. Called from resetPlayer() (so a flight always uses the
// character chosen at its start) and directly from selectOrBuyType() when
// not flying (so a menu-time switch is reflected immediately, not just on
// the next reset).
function applyCharacterStats() {
    let type = STICKMAN_TYPES[playerType] || STICKMAN_TYPES.classic;
    player.gravityMult = type.gravityMult;
    player.aeroDragMult = type.dragMult;
    player.powerMult = type.powerMult;
    player.breakMult = type.breakSpeedMult;
}

// Ground bullseye target: a small chance per run, active for that run only.
function maybeSpawnBullseye() {
    bullseye = null;
    if (Math.random() >= BULLSEYE_CHANCE) return;
    let bestM = Math.max(0, (bestRunX - player.startX) / pixelsPerMeter);
    let maxM = Math.max(220, bestM * 0.95);
    let m = 80 + Math.random() * (maxM - 80);
    bullseye = { x: player.startX + m * pixelsPerMeter };
}

function resetPlayer() {
    player.x = player.startX;
    player.y = player.groundY - player.radius;
    player.vx = 0;
    player.vy = 0;
    player.rotation = 0;
    player.stuckTicks = 0;
    prevRotation = 0;
    jetpackFuel = upgrades.jetpack.value;
    maxHeightReached = 0;
    woodBlocksDestroyed = 0;
    stoneBlocksDestroyed = 0;
    tntBlocksDestroyed = 0;
    guardsDestroyed = 0;
    armedGuardsDestroyed = 0;
    springsDestroyed = 0;
    fortsFullyDestroyedThisRun = 0;
    bossFullyDestroyedThisRun = 0;
    powerUsed = false;
    miniSplitUsed = false;
    miniShards = [];
    miniBagDrop = null;
    bombheadExplodedThisFlight = false;
    touchedIslandThisFlight = false;
    cannonEnterProgress = 0;
    activePower = Math.random() < POWER_CHANCE ? (Math.random() < 0.5 ? 'bomb' : 'rocket') : null;

    applyCharacterStats();
    maybeSpawnBullseye();
    updatePowerUI();
    camera.x = player.startX - width * 0.2;
    camera.y = player.groundY - height * 0.7;
    camera.zoom = 1;
}

// Bullet-time: eases nearGuardFactor toward 1 the closer the player gets to
// any alive guard while flying (see gameLoop's timeScale, and the zoom
// boost + vignette below). Only considers forts within a generous x range
// to stay cheap even with many forts loaded.
function updateNearGuardEffect() {
    let target = 0;
    if (state === 'FLYING') {
        let closestDist = Infinity;
        forts.forEach((fort) => {
            if (Math.abs(fort.x - player.x) > 900) return;
            fort.guards.forEach((g) => {
                if (!g.alive) return;
                let d = Math.hypot(g.x - player.x, (g.y + 17) - player.y) / pixelsPerMeter;
                if (d < closestDist) closestDist = d;
            });
        });
        if (closestDist <= SLOWMO_FAR_M) {
            target = clamp(1 - (closestDist - SLOWMO_NEAR_M) / (SLOWMO_FAR_M - SLOWMO_NEAR_M), 0, 1);
        }
    }
    nearGuardFactor += (target - nearGuardFactor) * 0.18;
}

function update() {
    if (shake > 0) { shake *= 0.85; if (shake < 0.1) shake = 0; }
    updateParticles();
    updateFloaters();
    updateLimbs();
    updateFortPhysics();
    updateShooterGuards();
    updateProjectiles();
    updateRockets();
    updateMiniShards();
    updateMiniBagDrop();
    updateNearGuardEffect();
    cloudDrift += 0.08;

    let thrusting = thrustHeld && jetpackFuel > 0 && state === 'FLYING';
    if (thrusting) startJetpackSound(); else stopJetpackSound();

    if (state === 'AIMING') {
        cannonEnterProgress += ((isDragging ? 1 : 0) - cannonEnterProgress) * 0.3;
        camera.targetX = player.startX - width * 0.2;
        camera.targetY = player.groundY - height * 0.7;
        camera.zoom = 1;
        camera.x += (camera.targetX - camera.x) * 0.1;
        camera.y += (camera.targetY - camera.y) * 0.1;
    } else if (state === 'FLYING') {
        let currentHeightM = Math.max(0, (getGroundY(player.x) - player.radius - player.y) / pixelsPerMeter);
        if (currentHeightM > maxHeightReached) maxHeightReached = currentHeightM;

        player.vy += gravity * player.gravityMult;
        if (thrusting) {
            player.vx += JETPACK_THRUST_X;
            player.vy += JETPACK_THRUST_Y;
            jetpackFuel--;
            if (Math.random() < 0.6) spawnDust(player.x - 12 + (Math.random() - 0.5) * 6, player.y + 14 + (Math.random() - 0.5) * 6, 2, '#fb923c');
        }
        let aero = getEffectiveAero();
        player.vx *= aero;
        player.vy *= aero;

        // Sub-step the position integration so fast flights can't tunnel
        // through steep terrain within a single physics tick.
        let frameSpeed = Math.hypot(player.vx, player.vy);
        let steps = Math.min(8, Math.max(1, Math.ceil(frameSpeed / 18)));
        let touchedFort = false;

        for (let s = 0; s < steps; s++) {
            player.x += player.vx / steps;
            player.y += player.vy / steps;
            player.rotation += (player.vx / steps) * 0.02;

            if (checkFortCollisions(player)) {
                touchedFort = true;
                if (playerType === 'bombhead' && !bombheadExplodedThisFlight) {
                    bombheadExplodedThisFlight = true;
                    destroyInRadius(player.x, player.y, BOMBHEAD_RADIUS, '#f97316');
                    spawnDust(player.x, player.y, 26, '#f97316');
                    spawnFloater(player.x, player.y - 26, 'POP!', '#f97316');
                    triggerShake(10);
                    playExplosion();
                }
            }

            let cg = getGroundY(player.x);
            if (player.y >= cg - player.radius) {
                player.y = cg - player.radius;

                let slopeY = getGroundY(player.x + 10) - getGroundY(player.x - 10);
                let slopeAngle = Math.atan2(slopeY, 20);

                let spd = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
                let velAngle = Math.atan2(player.vy, player.vx);
                let localAngle = velAngle - slopeAngle;

                let localVx = spd * Math.cos(localAngle);
                let localVy = spd * Math.sin(localAngle);

                if (localVy > 0) {
                    let impactSpeed = localVy;
                    if (localVy > 2) {
                        localVy = -localVy * Math.min(0.85, upgrades.bounce.value);
                        spawnDust(player.x, player.y, 10);
                        playBounce();
                        triggerShake(Math.min(10, impactSpeed * 0.6));
                        limbs.lf.angVel += impactSpeed * 0.018;
                        limbs.rf.angVel -= impactSpeed * 0.018;
                        limbs.torso.angVel += impactSpeed * 0.01;
                    } else {
                        localVy = 0;
                    }
                    localVx *= groundFriction;
                }

                player.vx = localVx * Math.cos(slopeAngle) - localVy * Math.sin(slopeAngle);
                player.vy = localVx * Math.sin(slopeAngle) + localVy * Math.cos(slopeAngle);
            }
        }

        // Low speed alone isn't enough on its own anymore -- a jetpack can
        // hold the player nearly still well above the ground (intentional
        // hovering), and that shouldn't end the run. So: low speed AND
