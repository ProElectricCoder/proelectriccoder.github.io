        // either close to the local ground (covers terrain and most forts)
        // OR actually touching fort geometry (covers tall forts and
        // notch/wedge cases where "close to local ground" doesn't apply,
        // since standing on a tall tower reads as high above its base pad).
        // touchedFort only reflects whether THIS tick's substep loop
        // resolved a hit; isTouchingFort is a same-position fallback query
        // for the case where velocity has just settled under the threshold
        // but nothing needed resolving this exact tick (see its comment).
        let heightM = Math.max(0, (getGroundY(player.x) - player.radius - player.y) / pixelsPerMeter);
        if (Math.abs(player.vx) < 0.1 && Math.abs(player.vy) < 0.1 &&
            (heightM <= LANDING_HEIGHT_LIMIT || touchedFort || isTouchingFort(player.x, player.y, player.radius))) {
            triggerLanding();
        }

        let targetZoom = 1;
        let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
        if (speed > 10) targetZoom = Math.max(0.3, 1 - (speed * 0.015));
        targetZoom = Math.min(1.5, targetZoom + nearGuardFactor * SLOWMO_ZOOM_BOOST);
        camera.zoom += (targetZoom - camera.zoom) * 0.05;

        // Look-ahead scales with speed instead of being a hard per-state
        // constant, so there's no camera pop at launch or at touchdown --
        // it just fades to 0 as player.vx approaches 0, which is exactly
        // what the LANDED branch below already assumes.
        let lookAhead = clamp(player.vx * 3, -60, 220);
        camera.targetX = player.x - (width / 2) / camera.zoom + lookAhead;
        camera.targetY = player.y - (height / 2) / camera.zoom;

        let playerGround = getGroundY(player.x);
        let maxCamY = playerGround + 100 - (height / camera.zoom);
        if (camera.targetY > maxCamY) camera.targetY = maxCamY;

        camera.x += (camera.targetX - camera.x) * 0.3;
        camera.y += (camera.targetY - camera.y) * 0.3;
        if (camera.x < -200) camera.x = -200;
    } else if (state === 'LANDED') {
        player.vx = 0;
        player.vy = 0;
        player.rotation *= 0.7;
        if (Math.abs(player.rotation) < 0.01) player.rotation = 0;

        if (flagProgress < 1) flagProgress += 0.08;

        camera.targetX = player.x - (width / 2) / camera.zoom;
        camera.targetY = player.y - (height / 2) / camera.zoom;
        camera.x += (camera.targetX - camera.x) * 0.1;
        camera.y += (camera.targetY - camera.y) * 0.1;

        landingTimer--;
        if (landingTimer <= 0) {
            finishLandingAndReset();
        }
    }

    updateHUD();
}

function triggerLanding() {
    state = 'LANDED';
    landingTimer = 90;
    flagProgress = 0;

    landingDist = Math.max(0, (player.x - player.startX) / pixelsPerMeter);
    landingEarned = Math.floor((landingDist * 2 + maxHeightReached
        + woodBlocksDestroyed * BLOCK_REWARD
        + stoneBlocksDestroyed * BLOCK_REWARD
        + tntBlocksDestroyed * TNT_REWARD
        + springsDestroyed * SPRING_REWARD
        + guardsDestroyed * GUARD_REWARD
        + armedGuardsDestroyed * SHOOTER_REWARD) * upgrades.mult.value);
    cash += landingEarned;

    let bullseyeBonus = 0;
    if (bullseye) {
        let distM = Math.abs(player.x - bullseye.x) / pixelsPerMeter;
        if (distM <= BULLSEYE_FALLOFF_RADIUS_M) {
            let t = Math.max(0, 1 - Math.max(0, distM - BULLSEYE_FULL_RADIUS_M) / (BULLSEYE_FALLOFF_RADIUS_M - BULLSEYE_FULL_RADIUS_M));
            bullseyeBonus = Math.round(BULLSEYE_MAX_REWARD * t);
            if (bullseyeBonus > 0) {
                cash += bullseyeBonus;
                spawnFloater(player.x, player.y - 46, (distM <= BULLSEYE_FULL_RADIUS_M ? 'BULLSEYE! +$' : '+$') + bullseyeBonus, '#FFC94C');
            }
        }
        bullseye = null;
    }

    if (touchedIslandThisFlight) lifetimeStats.islandsLanded = (lifetimeStats.islandsLanded || 0) + 1;

    lastRunX = player.x;
    let newBest = false;
    if (lastRunX > bestRunX) { bestRunX = lastRunX; newBest = true; }

    spawnDust(player.x, player.y, 20);
    playLand();
    triggerShake(4);

    landingCashVal.textContent = formatMoney(landingEarned + bullseyeBonus);
    landingCashToast.classList.add('show');

    lastRunText.textContent = `Last run: ${landingDist.toFixed(1)}m`;
    lastRunToast.classList.add('show');

    rewardUsedThisRun = false;
    rewardBtn.classList.add('show');

    shopBar.classList.add('show');
    updateShopUI();

    ensureDaily();
    dailyState.progress.fortsToday = (dailyState.progress.fortsToday || 0) + fortsFullyDestroyedThisRun;
    dailyState.progress.armedGuardsToday = (dailyState.progress.armedGuardsToday || 0) + armedGuardsDestroyed;
    dailyState.progress.cashToday = (dailyState.progress.cashToday || 0) + landingEarned + bullseyeBonus;
    dailyState.progress.bestDistanceTodayM = Math.max(dailyState.progress.bestDistanceTodayM || 0, landingDist);
    if (bossFullyDestroyedThisRun > 0) dailyState.progress.bossToday = (dailyState.progress.bossToday || 0) + bossFullyDestroyedThisRun;
    checkDailyCompletions();
    checkAchievements();

    if (newBest) CrazySDK.happytime();
    saveGame();
}

function finishLandingAndReset() {
    landingCashToast.classList.remove('show');
    lastRunToast.classList.remove('show');

    if (isRecording) stopRecording();

    resetPlayer();
    state = 'AIMING';
    aimHint.classList.remove('hidden');
    updateShopUI();
    ensureDaily();

    CrazySDK.requestMidgameAd();
}

// ============================================================================
// Minimap -- own canvas, drawn once per rendered frame
// ============================================================================
let minimapMaxX = 900; // only ever grows -- keeps the view stable instead of
                        // rescaling (and dragging the player dot around) every frame

function drawMinimap() {
    let mw = minimapCanvas.width;
    let mh = minimapCanvas.height;
    if (mw <= 0 || mh <= 0) return;

    mctx.clearRect(0, 0, mw, mh);

    let needed = Math.max(player.x, bestRunX, lastRunX) + 300;
    if (needed > minimapMaxX) minimapMaxX = needed;

    let scaleX = mw / minimapMaxX;
    let markerX = (worldX) => worldX * scaleX;

    let sampleCount = Math.min(400, Math.max(40, Math.ceil(minimapMaxX / 80)));
    let heights = [];
    let minH = Infinity, maxH = -Infinity;
    for (let i = 0; i <= sampleCount; i++) {
        let wx = (i / sampleCount) * minimapMaxX;
        let gy = getGroundY(wx);
        heights.push(gy);
        if (gy < minH) minH = gy;
        if (gy > maxH) maxH = gy;
    }
    // Islands float well above any sampled terrain height, so without this
    // they'd be clipped off the top of the minimap.
    forts.forEach((fort) => {
        if (fort.isIsland && fort.x <= minimapMaxX) minH = Math.min(minH, fort.baseY - 11 * BLOCK_SIZE - 40);
    });
    // Extend the range to cover the player's current altitude so the dot
    // is always plotted on the exact same scale as the terrain under it.
    minH = Math.min(minH, player.y - 20);
    let hRange = Math.max(1, maxH - minH);
    let toMinimapY = (worldY) => 8 + ((worldY - minH) / hRange) * (mh - 16);

    mctx.beginPath();
    mctx.moveTo(0, mh);
    for (let i = 0; i <= sampleCount; i++) {
        mctx.lineTo((i / sampleCount) * mw, toMinimapY(heights[i]));
    }
    mctx.lineTo(mw, mh);
    mctx.closePath();
    mctx.fillStyle = 'rgba(67, 217, 200, 0.35)';
    mctx.fill();

    forts.forEach((fort) => {
        if (fort.x > minimapMaxX) return;
        let fx = markerX(fort.x);
        let fy = toMinimapY(fort.baseY);
        if (fort.isBoss) {
            mctx.fillStyle = '#ef4444';
            mctx.strokeStyle = '#450a0a';
            mctx.lineWidth = 1.5;
            mctx.beginPath();
            mctx.arc(fx, fy - 10, 5, 0, Math.PI * 2);
            mctx.fill();
            mctx.stroke();
            return;
        }
        if (fort.isIsland) {
            mctx.fillStyle = fort.blocks.some((b) => b.alive && b.material !== 'island') ? '#7dd3fc' : '#38bdf8';
            mctx.beginPath();
            mctx.arc(fx, fy - 6, 3.5, 0, Math.PI * 2);
            mctx.fill();
            if (fort.guards.some((g) => g.alive)) {
                mctx.fillStyle = fort.guards.some((g) => g.alive && g.type === 'shooter') ? '#a855f7' : '#ef4444';
                mctx.beginPath();
                mctx.arc(fx, fy - 12, 2, 0, Math.PI * 2);
                mctx.fill();
            }
            return;
        }
        if (fort.blocks.some((b) => b.alive)) {
            mctx.fillStyle = '#a9784f';
            mctx.fillRect(fx - 1.5, fy - 5, 3, 5);
        }
        if (fort.guards.some((g) => g.alive)) {
            mctx.fillStyle = fort.guards.some((g) => g.alive && g.type === 'shooter') ? '#a855f7' : '#ef4444';
            mctx.beginPath();
            mctx.arc(fx, fy - 8, 2, 0, Math.PI * 2);
            mctx.fill();
        }
    });

    if (bullseye) {
        mctx.fillStyle = '#dc2626';
        mctx.beginPath();
        mctx.arc(markerX(bullseye.x), toMinimapY(getGroundY(bullseye.x)), 2.5, 0, Math.PI * 2);
        mctx.fill();
    }

    mctx.fillStyle = '#94a3b8';
    mctx.fillRect(markerX(player.startX) - 1, 4, 2, mh - 8);

    if (bestRunX > player.startX) {
        mctx.fillStyle = '#eab308';
        mctx.beginPath();
        mctx.arc(markerX(bestRunX), toMinimapY(getGroundY(bestRunX)), 3, 0, Math.PI * 2);
        mctx.fill();
    }

    if (lastRunX > player.startX) {
        mctx.fillStyle = '#3b82f6';
        mctx.beginPath();
        mctx.arc(markerX(lastRunX), toMinimapY(getGroundY(lastRunX)), 3, 0, Math.PI * 2);
        mctx.fill();
    }

    if (state === 'AIMING' && isDragging) {
        let launch = getDragVelocity();
        let points = predictTrajectoryPoints(launch.vx, launch.vy);

        mctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        mctx.lineWidth = 1.3;
        mctx.setLineDash([3, 3]);
        mctx.beginPath();
        points.forEach((p, i) => {
            let px = markerX(p.x), py = toMinimapY(p.y);
            if (i === 0) mctx.moveTo(px, py); else mctx.lineTo(px, py);
        });
        mctx.stroke();
        mctx.setLineDash([]);

        let landing = points[points.length - 1];
        mctx.fillStyle = '#ef4444';
        mctx.beginPath();
        mctx.arc(markerX(landing.x), toMinimapY(landing.y), 3, 0, Math.PI * 2);
        mctx.fill();
    } else if (state === 'AIMING' && hasLastAim) {
        let maxDrag = 200;
        let powerScale = (upgrades.power.value * player.powerMult) / maxDrag;
        let points = predictTrajectoryPoints(lastAimDx * powerScale, lastAimDy * powerScale);
        mctx.strokeStyle = 'rgba(183, 156, 242, 0.5)';
        mctx.lineWidth = 1.1;
        mctx.setLineDash([2, 3]);
        mctx.beginPath();
        points.forEach((p, i) => {
            let px = markerX(p.x), py = toMinimapY(p.y);
            if (i === 0) mctx.moveTo(px, py); else mctx.lineTo(px, py);
        });
        mctx.stroke();
        mctx.setLineDash([]);
    }

    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(markerX(player.x), toMinimapY(player.y), 4, 0, Math.PI * 2);
    mctx.fill();
    mctx.strokeStyle = '#16213E';
    mctx.lineWidth = 1.5;
    mctx.stroke();
}

// ============================================================================
// Drawing
// ============================================================================

// Cheap deterministic pseudo-random in [0, 1) from an integer-ish seed --
// same seed always gives the same value, so clouds don't flicker or need
// to be stored anywhere.
function cloudHash(seed) {
    let s = Math.sin(seed * 12.9898) * 43758.5453123;
    return s - Math.floor(s);
}

const CLOUD_PARALLAX = 0.3; // <1 so clouds drift slower than the foreground
const CLOUD_SLOT_WIDTH = 340;
// Clouds used to be placed in a thin band sized off the initial screen
// height, with no relation to camera.y -- fine near the ground, but once
// the player climbed toward a sky island (or the camera zoomed out on a big
// launch) that fixed band scrolled out of view and the clouds vanished.
// Anchoring the band to player.groundY (stable for the whole session) and
// making it tall enough to clear the highest possible island fixes that;
// CLOUD_LAYERS keeps density reasonable across the taller band.
const CLOUD_BAND_TOP = 7200; // px above player.groundY -- past the highest island (~130m = 6500px)
const CLOUD_BAND_BOTTOM = 60; // px above player.groundY
const CLOUD_LAYERS = 2;

// Puffy cumulus low down, flatter wispy stratus in the middle band, thin
// wind-streaked cirrus near the top of the band (closest to "space").
function drawCloudShape(cx, cy, size, kind) {
    if (kind === 'cirrus') {
        ctx.beginPath();
        ctx.ellipse(cx, cy, size * 2.4, size * 0.18, 0.12, 0, Math.PI * 2);
        ctx.ellipse(cx + size * 1.3, cy + size * 0.22, size * 1.6, size * 0.14, 0.12, 0, Math.PI * 2);
        ctx.fill();
    } else if (kind === 'wispy') {
        ctx.beginPath();
        ctx.ellipse(cx, cy, size * 1.5, size * 0.4, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + size, cy - size * 0.12, size * 1.05, size * 0.32, 0, 0, Math.PI * 2);
        ctx.ellipse(cx - size * 0.9, cy + size * 0.08, size * 0.85, size * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
        ctx.arc(cx + size * 0.5, cy - size * 0.3, size * 0.8, 0, Math.PI * 2);
        ctx.arc(cx + size, cy, size * 0.9, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawClouds() {
    // cloudDrift is a slow uniform "wind" added to every cloud's X below, so
    // clouds visibly drift even while the camera itself is still. It grows
    // without bound over a session, so the slot-visibility range here has
    // to be computed in the SAME pre-drift space (subtract it before
    // dividing into slots, add it back per-cloud when positioning) --
    // otherwise, as it accumulates, the slots needed to cover the side the
    // wind blows away from (the left) fall outside the checked range and
    // stop being generated, and clouds thin out and vanish there.
    let visLeft = camera.x * CLOUD_PARALLAX - 300 - cloudDrift;
    let visRight = camera.x * CLOUD_PARALLAX + (width / camera.zoom) + 300 - cloudDrift;
    let startSlot = Math.floor(visLeft / CLOUD_SLOT_WIDTH) - 1;
    let endSlot = Math.ceil(visRight / CLOUD_SLOT_WIDTH) + 1;
    let bandTop = player.groundY - CLOUD_BAND_TOP;
    let bandBottom = player.groundY - CLOUD_BAND_BOTTOM;

    for (let slot = startSlot; slot <= endSlot; slot++) {
        for (let layer = 0; layer < CLOUD_LAYERS; layer++) {
            let seed = slot * 12.37 + layer * 97.13;
            if (cloudHash(seed) > 0.42) continue; // keeps overall density similar to one ~50%-chance layer

            let jitterX = cloudHash(slot * 3.71 + layer * 6.2 + 5) * CLOUD_SLOT_WIDTH;
            let baseX = slot * CLOUD_SLOT_WIDTH + jitterX + cloudDrift;
            let vPos = cloudHash(seed + 2.3); // 0 = top of band (highest up), 1 = bottom (near ground)
            let cy = bandTop + vPos * (bandBottom - bandTop);
            let size = 24 + cloudHash(seed + 4.1) * 42;
            let cx = baseX + camera.x * (1 - CLOUD_PARALLAX);

            let kind = vPos < 0.3 ? 'cirrus' : vPos < 0.62 ? 'wispy' : 'puffy';
            let alpha = kind === 'cirrus' ? 0.35 : kind === 'wispy' ? 0.5 : 0.6;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            drawCloudShape(cx, cy, size, kind);
        }
    }
}

// ============================================================================
// Panoramic layered background -- two parallax mountain silhouettes behind
// the clouds, using the same deterministic cloudHash() so the ridgeline is
// stable (no reseeding/flicker) and needs no stored data of its own.
// ============================================================================
function mountainHeight(logicalX, seedOffset, amplitude) {
    let n1 = Math.sin((logicalX + seedOffset) * 0.0006) * amplitude;
    let n2 = Math.sin((logicalX + seedOffset) * 0.0021 + 3.1) * amplitude * 0.35;
    let n3 = Math.sin((logicalX + seedOffset) * 0.005 + 6.2) * amplitude * 0.15;
    return n1 + n2 + n3;
}

function drawMountainLayer(parallax, amplitude, ridgeYOffset, color, seedOffset) {
    let logicalLeft = camera.x * parallax - 400;
    let logicalRight = camera.x * parallax + (width / camera.zoom) + 400;
    let parallaxShift = camera.x * (1 - parallax);
    let ridgeY = player.groundY - ridgeYOffset;
    let step = 50;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(logicalLeft + parallaxShift, ridgeY + amplitude + 400);
    for (let lx = logicalLeft; lx <= logicalRight + step; lx += step) {
        ctx.lineTo(lx + parallaxShift, ridgeY - mountainHeight(lx, seedOffset, amplitude));
    }
    ctx.lineTo(logicalRight + step + parallaxShift, ridgeY + amplitude + 400);
    ctx.closePath();
    ctx.fill();
}

const MOUNTAIN_FAR_PARALLAX = 0.12;
const MOUNTAIN_NEAR_PARALLAX = 0.32;

function drawMountains() {
    drawMountainLayer(MOUNTAIN_FAR_PARALLAX, 260, 520, 'rgba(120, 140, 190, 0.55)', 0);
    drawMountainLayer(MOUNTAIN_NEAR_PARALLAX, 170, 260, 'rgba(90, 150, 130, 0.65)', 4000);
}

// Stars -- further back than even the mountains, so an almost-static
// parallax; fade in with spaceFactor (see draw()) so they're invisible near
// the ground and emerge the higher the player climbs. Same deterministic
// cloudHash() + drift-compensated slot math as drawClouds, for the same
// reason (see its comment).
const STAR_PARALLAX = 0.03;
const STAR_SLOT_WIDTH = 90;
const STAR_BAND_TOP = 9000;
const STAR_BAND_BOTTOM = 500;

function drawStars(spaceFactor) {
    if (spaceFactor < 0.04) return;
    let visLeft = camera.x * STAR_PARALLAX - 300 - cloudDrift;
    let visRight = camera.x * STAR_PARALLAX + (width / camera.zoom) + 300 - cloudDrift;
    let startSlot = Math.floor(visLeft / STAR_SLOT_WIDTH) - 1;
    let endSlot = Math.ceil(visRight / STAR_SLOT_WIDTH) + 1;
    let bandTop = player.groundY - STAR_BAND_TOP;
    let bandBottom = player.groundY - STAR_BAND_BOTTOM;
    let parallaxShift = camera.x * (1 - STAR_PARALLAX);

    ctx.fillStyle = '#ffffff';
    for (let slot = startSlot; slot <= endSlot; slot++) {
        let seed = slot * 7.91;
        if (cloudHash(seed) > 0.55) continue;
        let jitterX = cloudHash(slot * 2.13 + 3) * STAR_SLOT_WIDTH;
        let sx = slot * STAR_SLOT_WIDTH + jitterX + cloudDrift + parallaxShift;
        let sy = bandTop + cloudHash(seed + 5.5) * (bandBottom - bandTop);
        let size = 0.8 + cloudHash(seed + 9.1) * 1.6;
        let twinkle = 0.7 + Math.sin(cloudDrift * 0.06 + seed) * 0.3;
        ctx.globalAlpha = spaceFactor * twinkle;
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// A 4-point sparkle/star outline (sharp inner radius relative to outer) --
// used by the glow costumes below.
function starPath(cx, cy, outerR, innerR, points, rotation) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
        let r = i % 2 === 0 ? outerR : innerR;
        let a = rotation + (i / (points * 2)) * Math.PI * 2;
        let px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
}

function roundedRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
}

function drawBlock(block) {
    let bx = block.x - BLOCK_SIZE / 2, by = block.y;

    if (block.material === 'wood') {
        // Thick curved border only -- no fill, so it reads as a wooden crate outline.
        roundedRectPath(bx + 3, by + 3, BLOCK_SIZE - 6, BLOCK_SIZE - 6, 7);
        ctx.strokeStyle = '#6b4a2e';
        ctx.lineWidth = 5;
        ctx.stroke();
    } else if (block.material === 'stone') {
        roundedRectPath(bx, by, BLOCK_SIZE, BLOCK_SIZE, 7);
        ctx.fillStyle = '#8b93a1';
        ctx.fill();
        ctx.strokeStyle = '#5b6270';
        ctx.lineWidth = 2;
        ctx.stroke();
    } else if (block.material === 'spring') {
        // Teal block with a zig-zag coil motif -- indestructible, bounces on hit.
        roundedRectPath(bx + 2, by + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4, 6);
        ctx.fillStyle = '#2dd4bf';
        ctx.fill();
        ctx.strokeStyle = '#0f766e';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = '#134e4a';
        ctx.lineWidth = 2;
        let sx = bx + 5, sw = BLOCK_SIZE - 10;
        ctx.moveTo(sx, by + 8);
        for (let i = 0; i < 4; i++) ctx.lineTo(sx + sw * (i + 0.5) / 4, by + (i % 2 === 0 ? BLOCK_SIZE - 8 : 8));
        ctx.lineTo(sx + sw, by + BLOCK_SIZE - 8);
        ctx.stroke();
    } else if (block.material === 'island') {
        // Floating-island floor -- unbreakable dirt, grassy cap on the top row.
        roundedRectPath(bx, by, BLOCK_SIZE, BLOCK_SIZE, 3);
        ctx.fillStyle = '#8b6b4a';
        ctx.fill();
        ctx.strokeStyle = '#5c4529';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (block.row === -1) {
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(bx, by, BLOCK_SIZE, 6);
        }
    } else {
        // TNT -- red block, white stripe, black label.
        roundedRectPath(bx, by, BLOCK_SIZE, BLOCK_SIZE, 7);
        ctx.fillStyle = '#dc2626';
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = '#f5f5f4';
        ctx.fillRect(bx, by + BLOCK_SIZE * 0.34, BLOCK_SIZE, BLOCK_SIZE * 0.32);
        ctx.restore();
        ctx.strokeStyle = '#7f1d1d';
        ctx.lineWidth = 2;
        roundedRectPath(bx, by, BLOCK_SIZE, BLOCK_SIZE, 7);
        ctx.stroke();
        ctx.fillStyle = '#7f1d1d';
        ctx.font = 'bold 8px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TNT', block.x, by + BLOCK_SIZE * 0.58);
    }
}

// Small vector icons drawn with plain canvas paths (an emoji glyph can't be
// embedded in canvas text, so these stand in for the skull/cloud emoji that
// used to flank the boss/island labels).
function drawSkullIcon(cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);
    let s = size / 20;
    ctx.scale(s, s);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, -2); ctx.lineTo(9, 9);
    ctx.moveTo(9, -2); ctx.lineTo(-9, 9);
    ctx.stroke();
    ctx.fillStyle = '#3a3f4b';
    [[-9, -2], [9, 9], [9, -2], [-9, 9]].forEach(([px, py]) => {
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.fillStyle = '#f5f5f4';
    ctx.beginPath();
    ctx.arc(0, -4, 8, Math.PI, 0);
    ctx.lineTo(6, 2);
    ctx.lineTo(4, 6);
    ctx.lineTo(2, 3);
    ctx.lineTo(0, 6);
    ctx.lineTo(-2, 3);
    ctx.lineTo(-4, 6);
    ctx.lineTo(-6, 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1f2430';
    ctx.beginPath(); ctx.arc(-3.2, -4, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3.2, -4, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(-1.2, 2); ctx.lineTo(1.2, 2); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawCloudIcon(cx, cy, size) {
    ctx.save();
    let s = size / 20;
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(cx - 6 * s, cy, 5 * s, 0, Math.PI * 2);
    ctx.arc(cx, cy - 3 * s, 6 * s, 0, Math.PI * 2);
    ctx.arc(cx + 6 * s, cy, 5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBossLabel(fort) {
    let topY = fort.baseY - 18 * BLOCK_SIZE - 40;
    let label = 'BOSS FORTRESS';
    ctx.save();
    ctx.font = 'bold 22px ui-monospace, monospace';
    ctx.textAlign = 'center';
    let textW = ctx.measureText(label).width;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#450a0a';
    ctx.strokeText(label, fort.x, topY);
    ctx.fillStyle = '#ef4444';
    ctx.fillText(label, fort.x, topY);
    ctx.restore();
    drawSkullIcon(fort.x - textW / 2 - 16, topY - 7, 20);
    drawSkullIcon(fort.x + textW / 2 + 16, topY - 7, 20);
}

// Draws the island's floating base as one cohesive chunk of land -- a grass
// cap over a dirt body with a rough, organic underside (as if it tore away
// from the ground) -- instead of the individual 'island' material blocks,
// which read as a stack of stone rather than a landmass. The blocks
// themselves still exist and still drive collision; this only replaces
// how they're drawn (see drawForts, which skips them for drawBlock).
function drawIslandLand(fort) {
    let islandBlocks = fort.blocks.filter((b) => b.material === 'island');
    if (!islandBlocks.length) return;
    let left = Math.min(...islandBlocks.map((b) => b.x)) - BLOCK_SIZE / 2;
    let right = Math.max(...islandBlocks.map((b) => b.x)) + BLOCK_SIZE / 2;
    let top = fort.baseY;
    let bottom = top + ISLAND_BASE_ROWS * BLOCK_SIZE + 30;
    let corner = Math.min(14, (right - left) / 4);

    ctx.save();
    ctx.fillStyle = '#8b6b4a';
    ctx.beginPath();
    ctx.moveTo(left, top + 10);
    ctx.quadraticCurveTo(left, top, left + corner, top);
    ctx.lineTo(right - corner, top);
    ctx.quadraticCurveTo(right, top, right, top + 10);
    for (let x = right; x >= left; x -= 26) {
        let depth = bottom + cloudHash(fort.x * 0.31 + x * 0.07) * 26;
        ctx.lineTo(x, depth);
    }
    ctx.lineTo(left, top + 10);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.moveTo(left, top + 10);
    ctx.quadraticCurveTo(left, top, left + corner, top);
    ctx.lineTo(right - corner, top);
    ctx.quadraticCurveTo(right, top, right, top + 10);
    ctx.lineTo(right, top + 16);
    ctx.lineTo(left, top + 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    for (let x = left + 10; x <= right - 10; x += 20) {
        let h = 4 + cloudHash(fort.x * 0.19 + x * 0.11) * 5;
        ctx.strokeStyle = '#3fae63';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x + (cloudHash(x * 0.7 + fort.x) - 0.5) * 4, top - h);
        ctx.stroke();
    }
}

function drawIslandLabel(fort) {
    let topY = fort.baseY - 11 * BLOCK_SIZE - 30;
    let label = 'SKY FORT';
    ctx.save();
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    let textW = ctx.measureText(label).width;
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#0c4a6e';
    ctx.strokeText(label, fort.x, topY);
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText(label, fort.x, topY);
    ctx.restore();
    drawCloudIcon(fort.x - textW / 2 - 16, topY - 5, 16);
    drawCloudIcon(fort.x + textW / 2 + 16, topY - 5, 16);
}

function drawForts(viewLeft, viewRight) {
    forts.forEach((fort) => {
        if (fort.x < viewLeft - BLOCK_SIZE * 14 || fort.x > viewRight + BLOCK_SIZE * 14) return;
        if (fort.isIsland) drawIslandLand(fort);
        fort.blocks.forEach((block) => { if (block.alive && block.material !== 'island') drawBlock(block); });
        fort.guards.forEach((g) => { if (g.alive) drawGuard(g.x, g.y + 34, g.type); });
        if (fort.isBoss) drawBossLabel(fort);
        if (fort.isIsland) drawIslandLabel(fort);
    });
}

function drawGuard(x, standY, type) {
    ctx.save();
    ctx.translate(x, standY);
    let isShooter = type === 'shooter';
    ctx.strokeStyle = isShooter ? '#4c1d95' : '#7f1d1d';
    ctx.fillStyle = isShooter ? '#c4b5fd' : '#fca5a5';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, -26, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(0, -6);
    ctx.moveTo(0, -16);
    ctx.lineTo(-7, -10);
    ctx.moveTo(0, -16);
    ctx.lineTo(isShooter ? 11 : 7, isShooter ? -13 : -10);
    ctx.moveTo(0, -6);
    ctx.lineTo(-6, 0);
    ctx.moveTo(0, -6);
    ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.restore();
}

function drawProjectiles() {
    ctx.fillStyle = '#a855f7';
    projectiles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawFlag(x, color, label) {
    if (x <= player.startX) return;
    let y = getGroundY(x);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(x - 2, y - 60, 4, 60);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 60);
    ctx.lineTo(x + 30, y - 45);
    ctx.lineTo(x + 2, y - 30);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + 15, y - 70);
}

const CANNON_IDLE_ANGLE = -Math.PI * 0.35;
const CANNON_BARREL_LENGTH = 30;

// The launch site: a wheeled mount (drawn unrotated, so it stays upright
// regardless of aim) and a barrel that rotates to the given angle. Split in
// two so the barrel can be drawn again after the stickman -- see draw() --
// which is what makes the "loaded" pose read as being inside the tube
// rather than floating in front of it.
function drawCannonMount() {
    let cx = player.startX, cy = player.groundY - 10;
    ctx.save();
    ctx.translate(cx, cy);

    ctx.fillStyle = '#3a4256';
    ctx.beginPath();
    ctx.arc(0, 8, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1b2233';
    ctx.lineWidth = 3;
    ctx.stroke();
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(Math.cos(a) * 15, 8 + Math.sin(a) * 15);
        ctx.stroke();
    }
    ctx.fillStyle = '#0D1526';
    ctx.beginPath();
    ctx.arc(0, 8, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawCannonBarrel(angle) {
    let cx = player.startX, cy = player.groundY - 10;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = '#2f3a52';
    roundedRectPath(-6, -10, CANNON_BARREL_LENGTH, 20, 6);
    ctx.fill();
    ctx.strokeStyle = '#1b2233';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = '#FFC94C';
    ctx.lineWidth = 2;
    [4, 14].forEach((bx) => {
        ctx.beginPath();
        ctx.moveTo(bx, -10);
        ctx.lineTo(bx, 10);
        ctx.stroke();
    });
    ctx.fillStyle = '#1b2233';
    ctx.beginPath();
    ctx.arc(CANNON_BARREL_LENGTH - 4, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#05070d';
    ctx.beginPath();
    ctx.arc(CANNON_BARREL_LENGTH - 4, 0, 6.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

const SPEEDLINE_MIN_SPEED = 12;

// Cartoon motion streaks trailing behind the stickman above a speed
// threshold -- length/opacity scale with how far past that threshold.
function drawSpeedLines(x, y, vx, vy) {
    let speed = Math.hypot(vx, vy);
    if (speed < SPEEDLINE_MIN_SPEED) return;
    let angle = Math.atan2(vy, vx);
    let back = angle + Math.PI;
    let intensity = Math.min(1, (speed - SPEEDLINE_MIN_SPEED) / 25);
    ctx.save();
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
        let perp = (i - 1) * 8;
        let px = x + Math.cos(angle + Math.PI / 2) * perp;
        let py = y + Math.sin(angle + Math.PI / 2) * perp;
        let len = 12 + intensity * 22 + i * 3;
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.5 * intensity})`;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(back) * len, py + Math.sin(back) * len);
        ctx.stroke();
    }
    ctx.restore();
}

// A flattened-ellipse archery target painted on the ground -- active for
// at most one run (see maybeSpawnBullseye/triggerLanding).
function drawBullseye() {
    if (!bullseye) return;
    let gy = getGroundY(bullseye.x);
    let rings = [[40, '#dc2626'], [28, '#f8fafc'], [16, '#dc2626'], [6, '#f8fafc']];
    rings.forEach(([r, color]) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(bullseye.x, gy - 3, r, r * 0.32, 0, 0, Math.PI * 2);
        ctx.fill();
    });
}

const GRASS_STEP = 15;
const FLOWER_COLORS = ['#fde047', '#f9a8d4', '#f8fafc'];

// Small grass tufts along the ground surface, plus very sparse flowers, both
// using the same deterministic cloudHash() the clouds/mountains use so
// nothing flickers or reshuffles frame to frame.
function drawGrassAndFlowers(viewLeft, viewRight) {
    ctx.lineCap = 'round';
    for (let x = Math.floor(viewLeft / GRASS_STEP) * GRASS_STEP; x <= viewRight; x += GRASS_STEP) {
        let gy = getGroundY(x);
        let h1 = cloudHash(x * 0.913 + 1.7);
        let h2 = cloudHash(x * 0.913 + 4.2);
        let h3 = cloudHash(x * 0.913 + 8.9);
        ctx.strokeStyle = h1 > 0.5 ? '#3fae63' : '#57c97a';
        ctx.lineWidth = 1.6;
        [[-3, h1], [0, h2], [3, h3]].forEach(([offset, hv]) => {
            let bladeH = 5 + hv * 6;
            let lean = (hv - 0.5) * 6;
            ctx.beginPath();
            ctx.moveTo(x + offset, gy);
            ctx.lineTo(x + offset + lean, gy - bladeH);
            ctx.stroke();
        });

        if (cloudHash(x * 0.37 + 19.1) > 0.965) {
            let color = FLOWER_COLORS[Math.floor(cloudHash(x * 0.51 + 3) * FLOWER_COLORS.length)];
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, gy - 8, 2.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(x, gy - 8, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function draw() {
    let h = Math.max(0, player.groundY - player.y);
    let spaceFactor = Math.min(1, h / 10000);
    let r = Math.floor(135 * (1 - spaceFactor));
    let g = Math.floor(206 * (1 - spaceFactor));
    let b = Math.floor(235 * (1 - spaceFactor) + 50 * spaceFactor);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.scale(camera.zoom, camera.zoom);
    let shakeX = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    let shakeY = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(-(camera.x + shakeX), -(camera.y + shakeY));

    drawStars(spaceFactor);
    drawMountains();
    drawClouds();

    let startGridX = Math.floor((camera.x - 500) / (pixelsPerMeter * 10)) * (pixelsPerMeter * 10);
    let endGridX = camera.x + (width / camera.zoom) + 1000;

    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.moveTo(startGridX, player.groundY + 2000);
    for (let x = startGridX; x <= endGridX; x += 25) ctx.lineTo(x, getGroundY(x));
    ctx.lineTo(endGridX, player.groundY + 2000);
    ctx.fill();

    ctx.fillStyle = '#166534';
    ctx.beginPath();
    ctx.moveTo(startGridX, player.groundY + 2000);
    for (let x = startGridX; x <= endGridX; x += 25) ctx.lineTo(x, getGroundY(x) + 20);
    ctx.lineTo(endGridX, player.groundY + 2000);
    ctx.fill();

    drawGrassAndFlowers(startGridX, endGridX);
    drawForts(startGridX, endGridX);
    drawBullseye();

    ctx.fillStyle = 'white';
    ctx.font = '20px ui-monospace, monospace';
    ctx.textAlign = 'center';
    let markerSpacing = pixelsPerMeter * 10;
    let markerGridX = player.startX + Math.floor((startGridX - player.startX) / markerSpacing) * markerSpacing;
    for (let x = markerGridX; x < endGridX; x += markerSpacing) {
        if (x > player.startX) {
            let gy = getGroundY(x);
            ctx.fillRect(x, gy, 2, 15);
            ctx.fillText(`${Math.round((x - player.startX) / pixelsPerMeter)}m`, x, gy + 35);
        }
    }

    drawFlag(lastRunX, '#3b82f6', 'LAST');
    if (Math.abs(bestRunX - lastRunX) > 20) drawFlag(bestRunX, '#eab308', 'BEST');

    if (state === 'LANDED') {
        let fx = player.x + 30;
        let fy = getGroundY(fx);
        let poleH = 70 * Math.min(1, flagProgress);

        ctx.fillStyle = '#f87171';
        ctx.fillRect(fx - 2, fy - poleH, 4, poleH);

        if (flagProgress > 0.5) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(fx + 2, fy - poleH);
            ctx.lineTo(fx + 35, fy - poleH + 15);
            ctx.lineTo(fx + 2, fy - poleH + 30);
            ctx.fill();

            let badgeX = fx + 42;
            let badgeY = fy - poleH - 10;
            ctx.font = 'bold 16px ui-monospace, monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(`${landingDist.toFixed(1)}m`, badgeX, badgeY);
        }
    }

    let liveBarrelAngle = (state === 'AIMING' && isDragging) ? (() => { let d = getDragVelocity(); return Math.atan2(d.dy, d.dx); })() : CANNON_IDLE_ANGLE;
    drawCannonMount();

    if (state === 'AIMING' && hasLastAim) {
        ctx.strokeStyle = 'rgba(183, 156, 242, 0.4)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - lastAimDx, player.y - lastAimDy);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    if (state === 'AIMING' && isDragging) {
        let launch = getDragVelocity();
        let dx = launch.dx, dy = launch.dy;

        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x - dx, player.y - dy);
        ctx.stroke();

        let tx = player.x;
        let ty = player.y;
        let tvx = launch.vx;
        let tvy = launch.vy;
        let aero = getEffectiveAero();

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        for (let i = 0; i < 60; i += 2) {
            tvy += gravity * player.gravityMult;
            tvx *= aero;
            tvy *= aero;
            tx += tvx;
            ty += tvy;
            let cgy = getGroundY(tx);
            if (ty > cgy) {
                ty = cgy;
                tvy = -tvy * Math.min(0.85, upgrades.bounce.value);
            }
            ctx.lineTo(tx, ty);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    drawParticles();
    drawFloaters();
    drawProjectiles();
    drawRockets();
    miniShards.forEach((s) => drawSimpleStickman(s.x, s.y, s.rotation, MINI_SCALE));
    drawMiniBagDrop();

    if (state === 'AIMING') {
        let standX = player.startX - 40, standY = player.groundY - player.radius;
        let muzzleX = player.startX + Math.cos(liveBarrelAngle) * (CANNON_BARREL_LENGTH - 4);
        let muzzleY = (player.groundY - 10) + Math.sin(liveBarrelAngle) * (CANNON_BARREL_LENGTH - 4);
        let sx = standX + (muzzleX - standX) * cannonEnterProgress;
        let sy = standY + (muzzleY - standY) * cannonEnterProgress;
        let srot = (liveBarrelAngle + Math.PI / 2) * cannonEnterProgress;
        let sscale = 1 - 0.4 * cannonEnterProgress;
        drawStickman(sx, sy, srot, sscale, selectedCostume);
    } else {
        drawSpeedLines(player.x, player.y, player.vx, player.vy);
        drawStickman(player.x, player.y, player.rotation, 1, selectedCostume);
    }
    // Drawn AFTER the stickman (not with the mount, above) so the barrel
    // visually covers them while loaded, instead of the stickman floating
    // in front of the tube.
    drawCannonBarrel(liveBarrelAngle);

    ctx.restore();

    if (nearGuardFactor > 0.02) {
        ctx.save();
        ctx.globalAlpha = nearGuardFactor * 0.35;
        let grad = ctx.createRadialGradient(width / 2, height / 2, height * 0.25, width / 2, height / 2, height * 0.65);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.55)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
    }

    drawMinimap();
}

function drawRigidLimb(anchorX, anchorY, part) {
    let a = part.restAngle + part.angle;
    let endX = anchorX + part.length * Math.cos(a);
    let endY = anchorY + part.length * Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(anchorX, anchorY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
}

function drawStickman(x, y, rot, scale, costume) {
    scale = scale || 1;
    costume = costume || 'none';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);

    // Torso, shoulder, neck and head all ride the same rigid rod pivoting
    // at the hip -- it can lean, but it's always exactly `length` long.
    let torsoA = limbs.torso.restAngle + limbs.torso.angle;
    let dirX = Math.cos(torsoA), dirY = Math.sin(torsoA);
    let hipX = 0, hipY = 12;
    let shoulderX = hipX + 12 * dirX, shoulderY = hipY + 12 * dirY;
    let neckX = hipX + 16 * dirX, neckY = hipY + 16 * dirY;
    let headX = hipX + 24 * dirX, headY = hipY + 24 * dirY;

    let speed = Math.hypot(player.vx, player.vy);
    let speedBoost = clamp(speed / 30, 0, 1);

    if (costume.indexOf('glow-') === 0 && COSTUME_GLOW_COLORS[costume]) {
        let glowColor = COSTUME_GLOW_COLORS[costume];
        let radius = 30 + speedBoost * 34;
        let coreA = Math.round((0.55 + speedBoost * 0.4) * 255).toString(16).padStart(2, '0');
        let midA = Math.round((0.35 + speedBoost * 0.3) * 255).toString(16).padStart(2, '0');
        let grad = ctx.createRadialGradient(0, 10, 2, 0, 10, radius);
        grad.addColorStop(0, glowColor + coreA);
        grad.addColorStop(0.4, glowColor + midA);
        grad.addColorStop(1, glowColor + '00');
        ctx.fillStyle = grad;
        starPath(0, 10, radius, radius * 0.22, 4, cloudDrift * 0.02);
        ctx.fill();

        // Shines like a star the faster it's moving: a few rotating sparkle rays.
        if (speedBoost > 0.15) {
            ctx.save();
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = speedBoost * 0.7;
            for (let i = 0; i < 4; i++) {
                let a = (i / 4) * Math.PI * 2 + cloudDrift * 0.05;
                let len = 14 + speedBoost * 20;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 10, 10 + Math.sin(a) * 10);
                ctx.lineTo(Math.cos(a) * (10 + len), 10 + Math.sin(a) * len);
                ctx.stroke();
            }
            ctx.restore();
        }
    }

    if (costume.indexOf('cape-') === 0 && COSTUME_CAPE_COLORS[costume]) {
        // Trails toward wherever "behind" is in WORLD space (opposite the
        // direction of travel), regardless of how the body itself is
        // tumbling -- so it has to be converted into this already-rotated
        // local frame by subtracting `rot`, the frame's own world angle.
        let windAngle = Math.atan2(-player.vy, -player.vx) - rot;
        let trail = clamp(10 + speed * 1.1, 10, 40);
        let ripple = Math.sin(cloudDrift * 0.15) * 3;
        let midX = shoulderX + Math.cos(windAngle) * trail * 0.55 + Math.cos(windAngle + Math.PI / 2) * ripple;
        let midY = shoulderY + Math.sin(windAngle) * trail * 0.55 + 10 + Math.sin(windAngle + Math.PI / 2) * ripple;
        let tipX = shoulderX + Math.cos(windAngle) * trail;
        let tipY = shoulderY + Math.sin(windAngle) * trail * 0.65 + 14;
        ctx.fillStyle = COSTUME_CAPE_COLORS[costume];
        ctx.beginPath();
        ctx.moveTo(shoulderX - 2, shoulderY - 3);
        ctx.quadraticCurveTo(midX, midY, tipX, tipY);
        ctx.quadraticCurveTo(hipX + trail * 0.15, hipY + 10, hipX - 3, hipY + 6);
        ctx.closePath();
        ctx.fill();
    }

    // Minis: a small sack "containing" the others, worn until the split (see
    // triggerMiniSplit(), which also spawns the decorative dropped bag).
    if (playerType === 'mini' && !miniSplitUsed) {
        let bagX = hipX - dirX * 10, bagY = hipY - dirY * 10 + 2;
        ctx.save();
        ctx.fillStyle = '#8b5e34';
        ctx.beginPath();
        ctx.ellipse(bagX, bagY, 6.5, 8.5, torsoA + Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5c3d1f';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bagX - 4 * dirY, bagY + 4 * dirX);
        ctx.lineTo(bagX + 4 * dirY, bagY - 4 * dirX);
        ctx.stroke();
        ctx.restore();
    }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(neckX, neckY);
    ctx.stroke();

    // Bombhead: a bomb in place of the head until it's gone off this flight
    // (bombheadExplodedThisFlight), then a normal head for the rest of the run.
    let showBombHead = playerType === 'bombhead' && !bombheadExplodedThisFlight;
    ctx.beginPath();
    ctx.fillStyle = showBombHead ? '#1f2430' : '#fff';
    ctx.arc(headX, headY, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (showBombHead) {
        ctx.save();
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(headX + dirX * 8, headY + dirY * 8);
        ctx.quadraticCurveTo(headX + dirX * 13 + 3, headY + dirY * 13 - 2, headX + dirX * 14 + 2, headY + dirY * 14 - 4);
        ctx.stroke();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(headX + dirX * 14 + 2, headY + dirY * 14 - 4, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    drawRigidLimb(shoulderX, shoulderY, limbs.lh);
    drawRigidLimb(shoulderX, shoulderY, limbs.rh);
    drawRigidLimb(hipX, hipY, limbs.lf);
    drawRigidLimb(hipX, hipY, limbs.rf);

    if (costume.indexOf('hat-') === 0 && COSTUME_HAT_COLORS[costume]) {
        ctx.fillStyle = COSTUME_HAT_COLORS[costume];
        ctx.beginPath();
        ctx.moveTo(headX - dirY * 6, headY + dirX * 6);
        ctx.lineTo(headX + dirY * 6, headY - dirX * 6);
        ctx.lineTo(headX + dirX * 12, headY + dirY * 12);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

// A static (non-spring-animated) stickman pose for mini shards -- they
// don't share the single global `limbs` spring state with the main player.
function drawSimpleStickman(x, y, rot, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.lineTo(0, -4);
    ctx.moveTo(0, -4);
    ctx.lineTo(-9, 2);
    ctx.moveTo(0, -4);
    ctx.lineTo(9, 2);
    ctx.moveTo(0, 12);
    ctx.lineTo(-7, 22);
    ctx.moveTo(0, 12);
    ctx.lineTo(7, 22);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(0, -12, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function drawMiniBagDrop() {
    if (!miniBagDrop) return;
    ctx.save();
    ctx.translate(miniBagDrop.x, miniBagDrop.y);
    ctx.rotate(miniBagDrop.rotation);
    ctx.fillStyle = '#8b5e34';
    ctx.beginPath();
    ctx.ellipse(0, 0, 6.5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5c3d1f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4, -6);
    ctx.lineTo(4, -6);
    ctx.stroke();
    ctx.restore();
}

// ============================================================================
// HUD & shop UI
// ============================================================================
function updateHUD() {
    hudCash.textContent = formatMoney(cash);
    let dist = Math.max(0, (player.x - player.startX) / pixelsPerMeter);
    let currentHeight = Math.max(0, (getGroundY(player.x) - player.radius - player.y) / pixelsPerMeter);
    hudDist.textContent = dist.toFixed(1);
    hudHeight.textContent = currentHeight.toFixed(1);
    let fuelPct = upgrades.jetpack.value > 0 ? Math.round((jetpackFuel / upgrades.jetpack.value) * 100) : 0;
    fuelPct = Math.max(0, fuelPct);
    hudFuel.textContent = fuelPct;
    fuelTankFillEl.style.height = Math.min(100, fuelPct) + '%';
}

const ICON_BOMB = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="14" r="7" fill="currentColor" stroke="none"/><path d="M15 8l2-3"/><path d="M17 3l2 1.5"/><path d="M17 3l-1 2.2"/></svg>';
const ICON_ROCKET = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c3 2 4 6 4 10 0 2-1 4-2 5l-2 2-2-2c-1-1-2-3-2-5 0-4 1-8 4-10z" fill="currentColor" stroke="none"/><path d="M9 15l-3 2 1-4"/><path d="M15 15l3 2-1-4"/><circle cx="12" cy="9" r="1.4" fill="#0D1526" stroke="none"/></svg>';
const ICON_SPLIT = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><circle cx="12" cy="6" r="3"/></svg>';

function updatePowerUI() {
    if (playerType === 'mini' && !miniSplitUsed) {
        powerBtn.innerHTML = ICON_SPLIT + ' Split (B)';
        powerBtn.classList.add('show');
    } else if (activePower && !powerUsed) {
        powerBtn.innerHTML = (activePower === 'bomb' ? ICON_BOMB + ' Bomb (B)' : ICON_ROCKET + ' Rocket (B)');
        powerBtn.classList.add('show');
    } else {
        powerBtn.classList.remove('show');
    }
    if (!activePower && playerType !== 'mini') {
        powerAdBtn.classList.add('show');
    } else {
        powerAdBtn.classList.remove('show');
    }
}

function getUpgradeValDisplay(key) {
    let u = upgrades[key];
    if (key === 'power') return `${u.value}`;
    if (key === 'aero') return `${(u.value * 100).toFixed(1)}%`;
    if (key === 'bounce') return `${Math.round(u.value * 100)}%`;
    if (key === 'mult') return `${u.value.toFixed(1)}x`;
    if (key === 'jetpack') return `${(u.value / 60).toFixed(1)}s`;
    return u.value;
}

function updateShopUI() {
    shopBar.innerHTML = '';

    for (let key in upgrades) {
        let u = upgrades[key];
        let cost = getCost(key);
        let isMax = u.maxLvl && u.level >= u.maxLvl;
        let canAfford = cash >= cost && !isMax;

        let btn = document.createElement('button');
        btn.className = 'shop-btn' + (canAfford ? ' affordable' : '') + (isMax ? ' maxed' : '');
        btn.onclick = () => buyUpgrade(key);
        btn.innerHTML = `
            <div class="shop-name">${u.name}</div>
            <div class="shop-meta">
                <span>Lvl ${u.level}${isMax ? ' (MAX)' : ''}</span>
                <span class="lvl-val">${getUpgradeValDisplay(key)}</span>
            </div>
            <div class="shop-price">${isMax ? 'MAX' : '$' + formatMoney(cost)}</div>
        `;
        shopBar.appendChild(btn);
    }
}

// ============================================================================
// Reward ad, mute, and visibility handling
// ============================================================================
function grantRewardDouble() {
    if (rewardUsedThisRun) return;
    cash += landingEarned;
    landingEarned *= 2;
    landingCashVal.textContent = formatMoney(landingEarned);
    rewardUsedThisRun = true;
    rewardBtn.classList.remove('show');
    updateHUD();
    updateShopUI();
    saveGame();
}

rewardBtn.addEventListener('click', () => {
    if (rewardUsedThisRun) return;
    CrazySDK.requestRewardedAd(grantRewardDouble);
});

powerBtn.addEventListener('click', () => {
    if (playerType === 'mini' && !miniSplitUsed) triggerMiniSplit();
    else if (activePower === 'bomb') triggerBombHead();
    else if (activePower === 'rocket') triggerRocketHead();
});

powerAdBtn.addEventListener('click', () => {
    if (activePower) return;
    CrazySDK.requestRewardedAd(() => {
        activePower = Math.random() < 0.5 ? 'bomb' : 'rocket';
        powerUsed = false;
        updatePowerUI();
    });
});

const ICON_SPEAKER = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
const ICON_SPEAKER_MUTED = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3,9 8,9 13,4 13,20 8,15 3,15" fill="currentColor" stroke="none"/><path d="M16 9l6 6"/><path d="M22 9l-6 6"/></svg>';

muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.innerHTML = muted ? ICON_SPEAKER_MUTED : ICON_SPEAKER;
    muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        CrazySDK.gameplayStop();
    } else {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        CrazySDK.gameplayStart();
    }
});

// ============================================================================
// Achievements & Daily Challenges
// ============================================================================
function pickDailyChallenges() {
    let pool = [...DAILY_POOL];
    let picked = [];
    for (let i = 0; i < 3 && pool.length; i++) {
        let idx = Math.floor(Math.random() * pool.length);
        let def = pool.splice(idx, 1)[0];
        let target = def.gen();
        picked.push({ id: def.id, statKey: def.statKey, target, label: def.label(target) });
    }
    return picked;
}

// Resets the daily set whenever the device's local date has moved on since
// dailyState was last touched. Safe to call as often as needed -- a no-op
// when the day hasn't changed.
function ensureDaily() {
    let today = new Date().toDateString();
    if (dailyState.dayKey !== today) {
        dailyState = {
            dayKey: today,
            challenges: pickDailyChallenges(),
            progress: { fortsToday: 0, armedGuardsToday: 0, bestDistanceTodayM: 0, bossToday: 0, cashToday: 0 },
            claimed: {},
        };
    }
}

function showUnlockToast(title, text) {
    unlockToastTitle.textContent = title;
    unlockToastText.textContent = text;
    unlockToast.classList.add('show');
    clearTimeout(showUnlockToast._t);
    showUnlockToast._t = setTimeout(() => unlockToast.classList.remove('show'), 3200);
}

function checkAchievements() {
    ACHIEVEMENTS.forEach((a) => {
        if (unlockedAchievements.includes(a.id)) return;
        if (a.check()) {
            unlockedAchievements.push(a.id);
            cash += 100;
            showUnlockToast('Achievement Unlocked', a.name);
            CrazySDK.happytime();
        }
    });
    updateHUD();
    renderAchievementsPanel();
}

function checkDailyCompletions() {
    dailyState.challenges.forEach((c) => {
        if (dailyState.claimed[c.id]) return;
        if ((dailyState.progress[c.statKey] || 0) >= c.target) {
            dailyState.claimed[c.id] = true;
            cash += 60;
            showUnlockToast('Daily Challenge Complete', c.label);
        }
    });
    updateHUD();
    renderAchievementsPanel();
}

const ICON_CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFC94C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6 6L20 6"/></svg>';
const ICON_LOCK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#7C879E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_HOURGLASS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#9aa5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12"/><path d="M6 21h12"/><path d="M7 3c0 5 5 6 5 9s-5 4-5 9"/><path d="M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>';

function renderAchievementsPanel() {
    dailyListEl.innerHTML = dailyState.challenges.map((c) => {
        let val = Math.min(c.target, dailyState.progress[c.statKey] || 0);
        let displayVal = Math.round(val);
        let done = dailyState.claimed[c.id];
        let pct = Math.min(100, Math.round((val / c.target) * 100));
        return `<div class="overlay-item${done ? ' done' : ''}">
            <div class="overlay-item-top"><span class="overlay-item-label">${done ? ICON_CHECK : ICON_HOURGLASS} ${c.label}</span><span>${displayVal}/${c.target}</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>`;
    }).join('');

    achvListEl.innerHTML = ACHIEVEMENTS.map((a) => {
        let done = unlockedAchievements.includes(a.id);
        return `<div class="overlay-item${done ? ' done' : ''}">
            <div class="overlay-item-top"><span class="overlay-item-label">${done ? ICON_CHECK : ICON_LOCK} ${a.name}</span></div>
            <div class="overlay-item-desc">${a.desc}</div>
        </div>`;
    }).join('');
}

// ============================================================================
// Stickman types & costumes
// ============================================================================
function selectOrBuyType(key) {
    if (unlockedTypes.includes(key)) {
        playerType = key;
    } else if (cash >= STICKMAN_TYPES[key].unlockCost) {
        cash -= STICKMAN_TYPES[key].unlockCost;
        unlockedTypes.push(key);
        playerType = key;
        checkAchievements();
    } else {
        return;
    }
    // Only re-snapshot stats immediately when not mid-flight, so switching
    // characters can never retroactively alter the run already in progress.
    if (state !== 'FLYING') applyCharacterStats();
    renderCharactersPanel();
    updateHUD();
    updateShopUI();
    saveGame();
}

function selectOrBuyCostume(key) {
    if (unlockedCostumes.includes(key)) {
        selectedCostume = key;
    } else if (cash >= COSTUMES[key].unlockCost) {
        cash -= COSTUMES[key].unlockCost;
        unlockedCostumes.push(key);
        selectedCostume = key;
    } else {
        return;
    }
    renderCharactersPanel();
    updateHUD();
    updateShopUI();
    saveGame();
}

function renderCharactersPanel() {
    typeListEl.innerHTML = Object.keys(STICKMAN_TYPES).map((key) => {
        let t = STICKMAN_TYPES[key];
        let unlocked = unlockedTypes.includes(key);
        let selected = playerType === key;
        let canAfford = cash >= t.unlockCost;
        let label = selected ? 'Selected' : unlocked ? 'Select' : `$${formatMoney(t.unlockCost)}`;
        return `<div class="overlay-item${selected ? ' selected' : ''}">
            <div class="overlay-item-top"><span>${t.name}</span>
            <button class="overlay-action${(!unlocked && !canAfford) ? ' disabled' : ''}" data-type="${key}">${label}</button></div>
            <div class="overlay-item-desc">${t.desc}</div>
        </div>`;
    }).join('');

    costumeListEl.innerHTML = Object.keys(COSTUMES).map((key) => {
        let c = COSTUMES[key];
        let unlocked = unlockedCostumes.includes(key);
        let selected = selectedCostume === key;
        let canAfford = cash >= c.unlockCost;
        let label = selected ? 'Selected' : unlocked ? 'Select' : `$${formatMoney(c.unlockCost)}`;
        return `<div class="overlay-item${selected ? ' selected' : ''}">
            <div class="overlay-item-top"><span>${c.name}</span>
            <button class="overlay-action${(!unlocked && !canAfford) ? ' disabled' : ''}" data-costume="${key}">${label}</button></div>
            <div class="overlay-item-desc">${c.desc}</div>
        </div>`;
    }).join('');

    typeListEl.querySelectorAll('button[data-type]').forEach((btn) => {
        btn.onclick = () => selectOrBuyType(btn.dataset.type);
    });
    costumeListEl.querySelectorAll('button[data-costume]').forEach((btn) => {
        btn.onclick = () => selectOrBuyCostume(btn.dataset.costume);
    });
}

const ALL_OVERLAYS = [achievementsOverlay, charactersOverlay];

function closeAllOverlays() {
    ALL_OVERLAYS.forEach((el) => el.classList.remove('show'));
    gamePaused = false;
}

// Opening a panel pauses the game (so nothing changes underneath while it's
// open) and closes any other open panel first, so at most one is ever
// visible -- and therefore at most one close button is ever the "live" one.
function openOverlay(el) {
    closeAllOverlays();
    el.classList.add('show');
    gamePaused = true;
}

function closeOverlay(el) {
    el.classList.remove('show');
    gamePaused = false;
}

achievementsBtn.addEventListener('click', () => { renderAchievementsPanel(); openOverlay(achievementsOverlay); });
charactersBtn.addEventListener('click', () => { renderCharactersPanel(); openOverlay(charactersOverlay); });
document.querySelectorAll('.overlay-close').forEach((btn) => {
    btn.addEventListener('click', () => closeOverlay(document.getElementById(btn.dataset.close)));
});
// Clicking the dimmed backdrop (anywhere outside the card) also closes --
// only when the click target is the backdrop itself, not a bubbled click
// from something inside the card.
ALL_OVERLAYS.forEach((el) => {
    el.addEventListener('click', (e) => { if (e.target === el) closeOverlay(el); });
});

// ============================================================================
// Run recording -- canvas + synthesized audio -> a downloadable .webm clip
// ============================================================================
function canRecord() {
    return typeof MediaRecorder !== 'undefined' && !!canvas.captureStream;
}

function startRecording() {
    if (!canRecord()) return;
    ensureAudio();
    recordedChunks = [];
    let stream = canvas.captureStream();
    if (audioDestNode) audioDestNode.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
    let mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    try {
        mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6000000 });
    } catch (e) {
        mediaRecorder = null;
        return;
    }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        let blob = new Blob(recordedChunks, { type: 'video/webm' });
        if (lastRecordingUrl) URL.revokeObjectURL(lastRecordingUrl);
        lastRecordingUrl = URL.createObjectURL(blob);
        showRecordingDownload();
    };
    mediaRecorder.start();
    isRecording = true;
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
}

function showRecordingDownload() {
    recordingDownloadEl.href = lastRecordingUrl;
    recordingDownloadEl.download = `stickman-run-${landingDist.toFixed(0)}m.webm`;
    recordingDownloadEl.classList.add('show');
}

recordBtn.addEventListener('click', () => {
    recordArmed = !recordArmed;
    recordBtn.classList.toggle('armed', recordArmed);
    recordBtn.setAttribute('aria-label', recordArmed ? 'Recording armed -- tap to disarm' : 'Arm run recording');
});

// ============================================================================
// Fixed-timestep main loop
// ----------------------------------------------------------------------------
// Physics run on a fixed 60Hz-equivalent tick regardless of the display's
// real refresh rate, so the game plays identically on a 60Hz and a 165Hz
// monitor -- CrazyGames explicitly requires physics to be refresh-rate
// independent. Rendering still runs every animation frame.
// ============================================================================
const FIXED_DT = 1000 / 60;
const MAX_ACCUMULATED = FIXED_DT * 5;
let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let frameTime = timestamp - lastTime;
    lastTime = timestamp;

    if (!gamePaused) {
        if (frameTime > MAX_ACCUMULATED) frameTime = MAX_ACCUMULATED;
        timeScale = 1 - nearGuardFactor * (1 - SLOWMO_MIN_SCALE);
        accumulator += frameTime * timeScale;
        while (accumulator >= FIXED_DT) {
            update();
            accumulator -= FIXED_DT;
        }
    } else {
        accumulator = 0;
    }

    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================================
// Boot
// ============================================================================
CrazySDK.init();

if (!SHOW_AD_UI) document.body.classList.add('hide-ad-ui');
document.body.classList.add('pre-launch');
resize();
resetPlayer();
generateForts();
updateShopUI();
ensureDaily();
renderAchievementsPanel();
renderCharactersPanel();
if (!canRecord() || IS_CRAZYGAMES_BUILD) recordBtn.style.display = 'none';
aimHint.classList.remove('hidden');
requestAnimationFrame(gameLoop);

loadingScreen.classList.add('hidden');
</script>
