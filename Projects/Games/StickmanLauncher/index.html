<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stickman Launcher: Fort Destruction</title>

<!--
  CrazyGames SDK v3 -- live.
  ------------------------------------------------------------------
  The CrazySDK wrapper in the <script> below (search "CrazySDK") checks
  for window.CrazyGames before touching it, so this build still runs
  fine anywhere the SDK isn't present (local testing, other hosts) --
  it just skips ads/saves/etc. and plays standalone.
  Docs: https://docs.crazygames.com/sdk/html5-v3/ (verified Sept 2026).
-->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

<style>
  :root {
    --ink: #16213E;
    --ink-deep: #0D1526;
    --gold: #FFC94C;
    --teal: #43D9C8;
    --violet: #B79CF2;
    --ember: #FF8A3D;
    --paper: #E9ECF5;
    --font-ui: ui-rounded, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; overflow: hidden;
    height: 100%;
    background: #6EC6E8;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    font-family: var(--font-ui);
  }

  button { font-family: inherit; border: none; cursor: pointer; background: none; padding: 0; color: inherit; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  canvas { display: block; touch-action: none; }

  #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  #ui-layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px;
    pointer-events: none;
  }

  /* Loading */
  #loading-screen {
    position: absolute; inset: 0; z-index: 20;
    background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--paper);
    font-size: 0.95rem;
    transition: opacity 0.35s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; margin-bottom: 14px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Title screen -- visible only before the player's first launch */
  #title-screen {
    position: absolute; top: 12%; left: 50%;
    transform: translateX(-50%);
    width: 100%; padding: 0 16px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  body.pre-launch #title-screen { opacity: 1; }
  .title-main {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", "Marker Felt", cursive;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    font-weight: 700;
    color: #000;
    text-shadow: 0 4px 0 var(--gold), 0 10px 18px rgba(0, 0, 0, 0.35);
  }
  .title-stickman {
    width: 0.6em;
    height: 0.88em;
    vertical-align: -0.14em;
    margin: 0 0.02em;
    overflow: visible;
  }
  .title-sub {
    font-family: var(--font-mono);
    font-size: clamp(0.7rem, 2.2vw, 0.95rem);
    font-weight: 700;
    color: var(--paper);
    letter-spacing: 0.2em;
    margin-top: 6px;
    text-shadow: 0 2px 0 var(--ink-deep);
  }

  /* Before the first launch, show nothing but the title + aim-hint --
     hud-panel, the mute button, and the minimap fade in once you launch. */
  .hud-panel, #mute-btn, .minimap-wrap { transition: opacity 0.35s ease; }
  body.pre-launch .hud-panel,
  body.pre-launch #mute-btn,
  body.pre-launch .minimap-wrap {
    opacity: 0;
    pointer-events: none;
  }

  /* Top cluster: minimap + HUD row, grouped so both stay pinned to the
     top edge while #ui-layer space-betweens against the bottom cluster */
  .top-cluster { display: flex; flex-direction: column; gap: 10px; width: 100%; }

  .minimap-wrap {
    align-self: center;
    width: min(92vw, 560px);
    height: 56px;
    background: var(--ink);
    border-radius: 10px;
    border-bottom: 3px solid var(--ink-deep);
    padding: 4px;
    overflow: hidden;
  }
  #minimapCanvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  .hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .hud-panel {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: 10px;
    border-bottom: 3px solid var(--ink-deep);
  }
  .hud-cash { font-family: var(--font-mono); font-size: 1.45rem; font-weight: 700; color: var(--gold); }
  .hud-stat { font-family: var(--font-mono); font-size: 0.95rem; color: var(--paper); margin-top: 2px; }
  #hud-dist { color: var(--teal); font-weight: 600; }
  #hud-height { color: var(--violet); font-weight: 600; }
  #hud-fuel { color: #fb923c; font-weight: 600; }

  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .icon-btn {
    pointer-events: auto;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--ink);
    border-bottom: 3px solid var(--ink-deep);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { transform: translateY(2px); border-bottom-width: 1px; }

  #power-btn {
    pointer-events: none;
    background: var(--violet);
    color: var(--ink-deep);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(183, 156, 242, 0.45);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  #power-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #power-btn:active { transform: translateY(2px); }

  .aim-hint {
    background: var(--teal);
    color: var(--ink-deep);
    padding: 9px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .aim-hint.hidden { display: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* Bottom cluster: toasts, reward button, shop */
  .bottom-cluster { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

  .toast {
    text-align: center;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  #last-run-toast {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    padding: 6px 18px;
  }

  #landing-cash-toast {
    background: var(--gold);
    color: var(--ink-deep);
    padding: 10px 26px;
    border-radius: 20px;
    box-shadow: 0 10px 24px rgba(255, 201, 76, 0.4);
  }
  .cash-amount { display: block; font-family: var(--font-mono); font-size: 1.6rem; font-weight: 800; }
  .cash-label { font-size: 0.68rem; font-weight: 600; opacity: 0.75; }

  #reward-btn {
    pointer-events: none;
    background: var(--ember);
    color: #331700;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 10px;
    box-shadow: 0 8px 18px rgba(255, 138, 61, 0.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #reward-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #reward-btn:active { transform: translateY(2px); }

  #power-ad-btn {
    pointer-events: none;
    background: var(--teal);
    color: var(--ink-deep);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 9px 16px;
    border-radius: 10px;
    box-shadow: 0 8px 16px rgba(67, 217, 200, 0.35);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #power-ad-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #power-ad-btn:active { transform: translateY(2px); }

  /* SHOW_AD_UI (in the script below) toggles this class at boot -- hides
     every ad-related button outright, regardless of what .show is doing. */
  body.hide-ad-ui #reward-btn,
  body.hide-ad-ui #power-ad-btn {
    display: none !important;
  }

  /* Shop */
  #shop-bar {
    display: flex; justify-content: center; gap: 8px;
    width: 100%; max-width: 720px;
    opacity: 0; transform: translateY(30px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  #shop-bar.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .shop-btn {
    flex: 1; min-width: 0;
    padding: 9px;
    border-radius: 12px;
    border-bottom: 3px solid var(--ink-deep);
    background: var(--ink);
    color: #7C879E;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: left;
    cursor: not-allowed;
  }
  .shop-btn.affordable { color: var(--paper); cursor: pointer; }
  .shop-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
  .shop-name { font-weight: 700; font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shop-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.65rem; margin-top: 3px; }
  .shop-meta .lvl-val { color: var(--gold); font-weight: 700; }
  .shop-price {
    margin-top: 7px; text-align: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 0.78rem;
    padding: 4px 0; border-radius: 7px;
    background: var(--ink-deep); color: #5A6478;
  }
  .shop-btn.affordable .shop-price { background: var(--gold); color: var(--ink-deep); }
  .shop-btn.maxed .shop-price { color: var(--paper); }

  @media (max-width: 480px) {
    .minimap-wrap { height: 42px; }
    .hud-cash { font-size: 1.2rem; }
    .hud-stat { font-size: 0.82rem; }
    .hud-panel { padding: 8px 14px; }
    #shop-bar { flex-wrap: wrap; }
    .shop-btn { min-width: calc(50% - 4px); flex: 0 0 calc(50% - 4px); }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div>Prepping the launch pad&hellip;</div>
  </div>

  <div id="title-screen">
    <div class="title-main" aria-label="Stickman Launcher">ST<svg class="title-stickman" viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="12" y1="11" x2="12" y2="22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="14" x2="4" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="14" x2="20" y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="22" x2="5" y2="30" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="22" x2="19" y2="30" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>CKMAN LAUNCHER</div>
    <div class="title-sub">FORT DESTRUCTION</div>
  </div>

  <div id="ui-layer">
    <div class="top-cluster">
      <div class="minimap-wrap">
        <canvas id="minimapCanvas"></canvas>
      </div>
      <div class="hud-row">
        <div class="hud-panel">
          <div class="hud-cash">Cash: $<span id="hud-cash">0</span></div>
          <div class="hud-stat">Distance: <span id="hud-dist">0</span>m</div>
          <div class="hud-stat">Height: <span id="hud-height">0</span>m</div>
          <div class="hud-stat">Fuel: <span id="hud-fuel">0</span>%</div>
        </div>
        <div class="top-right">
          <button id="mute-btn" class="icon-btn" aria-label="Mute">&#128266;</button>
          <button id="power-btn">Power</button>
          <div id="aim-hint" class="aim-hint hidden">Drag back, then release to launch.</div>
        </div>
      </div>
    </div>

    <div class="bottom-cluster">
      <div id="last-run-toast" class="toast"><span id="last-run-text">Last run: 0m</span></div>
      <div id="landing-cash-toast" class="toast">
        <span class="cash-amount">+$<span id="landing-cash-val">0</span></span>
        <span class="cash-label">cash earned</span>
      </div>
      <button id="reward-btn">Watch ad for 2&times; cash</button>
      <button id="power-ad-btn">Watch ad: get a power</button>
      <div id="shop-bar"></div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================================
// CrazyGames SDK v3 -- commented integration
// ----------------------------------------------------------------------------
// Every method below checks `this.ready` (or `window.CrazyGames` directly in
// init) before touching the SDK, so this same file still runs standalone
// anywhere the SDK script doesn't load -- local testing, other hosts, etc.
// Verified against https://docs.crazygames.com/sdk/html5-v3/ (Sept 2026).
// ============================================================================
const CrazySDK = {
    ready: false,

    init() {
        if (typeof window.CrazyGames === 'undefined') {
            console.warn('[CrazySDK] SDK script not present -- running standalone.');
            return;
        }
        window.CrazyGames.SDK.init().then(() => {
            this.ready = true;
            console.log('[CrazySDK] ready, environment:', window.CrazyGames.SDK.environment);
            this.loadingStart();
            loadGame();
            updateShopUI();
            updateHUD();
            this.loadingStop();
            this.gameplayStart();
        }).catch((e) => console.warn('[CrazySDK] init failed', e));
    },

    loadingStart() {
        if (this.ready) window.CrazyGames.SDK.game.loadingStart();
    },

    loadingStop() {
        if (this.ready) window.CrazyGames.SDK.game.loadingStop();
    },

    // Call whenever the player is actively playing / resumes after a break.
    gameplayStart() {
        if (this.ready) window.CrazyGames.SDK.game.gameplayStart();
    },

    // Call on every break: menu, pause, or right before an ad.
    gameplayStop() {
        if (this.ready) window.CrazyGames.SDK.game.gameplayStop();
    },

    // Use sparingly -- reserved for genuinely special moments (new best run).
    happytime() {
        if (this.ready) window.CrazyGames.SDK.game.happytime();
    },

    // CrazyGames auto-throttles midgame ads (max ~1 every 3 min), so it's
    // fine to just call this after every landing with no extra bookkeeping.
    requestMidgameAd() {
        if (!this.ready) return;
        window.CrazyGames.SDK.ad.requestAd('midgame', {
            adStarted: () => {
                gamePaused = true; adMuted = true;
                if (audioCtx) audioCtx.suspend();
                CrazySDK.gameplayStop();
            },
            adFinished: () => {
                gamePaused = false; adMuted = false;
                if (audioCtx) audioCtx.resume();
                CrazySDK.gameplayStart();
            },
            adError: (error) => {
                console.log('[CrazySDK] midgame ad error', error);
                gamePaused = false; adMuted = false;
                if (audioCtx) audioCtx.resume();
                CrazySDK.gameplayStart();
            },
        });
    },

    // CrazyGames requires rewarded-ad buttons to always have a real effect;
    // if the SDK isn't connected we just grant the reward directly so the
    // button still does something (and stays testable locally).
    requestRewardedAd(onReward) {
        if (this.ready) {
            window.CrazyGames.SDK.ad.requestAd('rewarded', {
                adStarted: () => {
                    gamePaused = true; adMuted = true;
                    if (audioCtx) audioCtx.suspend();
                    CrazySDK.gameplayStop();
                },
                adFinished: () => {
                    gamePaused = false; adMuted = false;
                    if (audioCtx) audioCtx.resume();
                    CrazySDK.gameplayStart();
                    onReward();
                },
                adError: (error) => {
                    console.log('[CrazySDK] rewarded ad error', error);
                    gamePaused = false; adMuted = false;
                    if (audioCtx) audioCtx.resume();
                    CrazySDK.gameplayStart();
                },
            });
            return;
        }
        onReward();
    },

    // CrazyGames' data module survives third-party storage restrictions
    // inside their iframe and syncs across a signed-in player's devices --
    // used by saveGame()/loadGame() below for cash, best run, and upgrades.
    saveProgress(data) {
        if (this.ready) window.CrazyGames.SDK.data.setItem('save', JSON.stringify(data));
    },

    loadProgress() {
        if (this.ready) {
            const raw = window.CrazyGames.SDK.data.getItem('save');
            return raw ? JSON.parse(raw) : null;
        }
        return null;
    },
};

// ============================================================================
// DOM references
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const hudCash = document.getElementById('hud-cash');
const hudDist = document.getElementById('hud-dist');
const hudHeight = document.getElementById('hud-height');
const hudFuel = document.getElementById('hud-fuel');
const aimHint = document.getElementById('aim-hint');
const lastRunToast = document.getElementById('last-run-toast');
const lastRunText = document.getElementById('last-run-text');
const landingCashToast = document.getElementById('landing-cash-toast');
const landingCashVal = document.getElementById('landing-cash-val');
const shopBar = document.getElementById('shop-bar');
const rewardBtn = document.getElementById('reward-btn');
const powerBtn = document.getElementById('power-btn');
const powerAdBtn = document.getElementById('power-ad-btn');
const muteBtn = document.getElementById('mute-btn');
const loadingScreen = document.getElementById('loading-screen');
const minimapCanvas = document.getElementById('minimapCanvas');
const mctx = minimapCanvas.getContext('2d');

// ============================================================================
// Audio -- small synthesized effects via Web Audio API (no external files)
// ============================================================================
let audioCtx = null;
let muted = false;
let adMuted = false;

function ensureAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            audioCtx = null;
        }
    } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function beep({ freq = 440, freqEnd = null, duration = 0.12, type = 'sine', gain = 0.15 } = {}) {
    if (muted || adMuted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    const now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), now + duration);
    g.gain.setValueAtTime(gain, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
}

function playLaunch() { beep({ freq: 180, freqEnd: 700, duration: 0.18, type: 'sawtooth', gain: 0.12 }); }
function playBounce() { beep({ freq: 220, freqEnd: 80, duration: 0.09, type: 'square', gain: 0.10 }); }
function playLand() {
    beep({ freq: 523.25, duration: 0.10, type: 'sine', gain: 0.14 });
    setTimeout(() => beep({ freq: 783.99, duration: 0.16, type: 'sine', gain: 0.14 }), 90);
}

let jetpackOsc = null, jetpackGain = null;
function startJetpackSound() {
    if (jetpackOsc || !audioCtx || muted || adMuted) return;
    jetpackOsc = audioCtx.createOscillator();
    jetpackGain = audioCtx.createGain();
    jetpackOsc.type = 'sawtooth';
    jetpackOsc.frequency.value = 90;
    jetpackGain.gain.value = 0.05;
    jetpackOsc.connect(jetpackGain);
    jetpackGain.connect(audioCtx.destination);
    jetpackOsc.start();
}
function stopJetpackSound() {
    if (!jetpackOsc) return;
    try { jetpackOsc.stop(); } catch (e) { /* already stopped */ }
    jetpackOsc.disconnect();
    jetpackGain.disconnect();
    jetpackOsc = null;
    jetpackGain = null;
}

// ============================================================================
// Particles (landing dust) + screen shake
// ============================================================================
let particles = [];
let shake = 0;

function spawnDust(x, y, count = 14, color = '#a8a29e') {
    for (let i = 0; i < count; i++) {
        let angle = Math.PI + Math.random() * Math.PI;
        let speed = 2 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            size: 3 + Math.random() * 4,
            color,
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += 0.15;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function triggerShake(amount) {
    shake = Math.max(shake, amount);
}

let floaters = [];

function spawnFloater(x, y, text, color) {
    floaters.push({ x, y, vy: -1.2, life: 1, text, color });
}

function updateFloaters() {
    for (let i = floaters.length - 1; i >= 0; i--) {
        let f = floaters[i];
        f.y += f.vy;
        f.life -= 0.02;
        if (f.life <= 0) floaters.splice(i, 1);
    }
}

function drawFloaters() {
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    floaters.forEach((f) => {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
}

// ============================================================================
// Config & core state
// ============================================================================
let width, height;
let state = 'AIMING';
let cash = 0;
let gamePaused = false;

const upgrades = {
    power: { name: 'Cannon Power', level: 1, baseCost: 50, costMult: 1.5, value: 25, valStep: 5, desc: 'Launch speed' },
